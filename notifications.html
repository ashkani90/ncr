<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اعلان‌ها</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .notifications-container { background: white; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); padding: 25px; }
        .notifications-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .notifications-header h3 { margin: 0; color: #2c3e50; }
        .notifications-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .notifications-filters { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 20px; border: 2px solid #e9ecef; background: white; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600; color: #6c757d; transition: all 0.3s ease; font-family: inherit; }
        .filter-btn:hover { border-color: #667eea; color: #667eea; }
        .filter-btn.active { background: #667eea; color: white; border-color: #667eea; }
        .notifications-list { display: flex; flex-direction: column; gap: 10px; }
        .notification-item { display: flex; gap: 15px; padding: 15px 20px; border-radius: 12px; background: #f8f9fa; border: 2px solid transparent; transition: all 0.3s ease; position: relative; }
        .notification-item:hover { background: #f0f4ff; border-color: #667eea; }
        .notification-item.unread { background: #f0f4ff; border-right: 4px solid #667eea; }
        .notification-item.read { opacity: 0.75; }
        .notification-item .notification-icon { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .notification-icon.info { background: #e3f2fd; color: #1976d2; }
        .notification-icon.success { background: #e8f5e9; color: #388e3c; }
        .notification-icon.warning { background: #fff3e0; color: #f57c00; }
        .notification-icon.danger { background: #fce4ec; color: #c62828; }
        .notification-content { flex: 1; min-width: 0; }
        .notification-title { font-weight: 700; font-size: 15px; color: #2c3e50; margin-bottom: 4px; }
        .notification-message { font-size: 13px; color: #6c757d; margin-bottom: 6px; line-height: 1.5; }
        .notification-time { font-size: 11px; color: #adb5bd; }
        .notification-actions { display: flex; flex-direction: column; gap: 5px; align-items: center; justify-content: center; }
        .toggle-read-btn { background: white; border: 2px solid #e9ecef; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px; color: #6c757d; transition: all 0.3s ease; white-space: nowrap; font-family: inherit; }
        .toggle-read-btn:hover { border-color: #667eea; color: #667eea; background: #f0f4ff; }
        .unread-badge { position: absolute; top: 10px; left: 10px; background: #667eea; color: white; font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 700; }
        .no-notifications { text-align: center; padding: 60px 20px; color: #adb5bd; }
        .no-notifications i { font-size: 60px; margin-bottom: 15px; display: block; }
        .no-notifications p { font-size: 15px; margin: 0; }
        .loading { text-align: center; padding: 40px; color: #6c757d; }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="headerContainer"></div>
        <div id="sidebarContainer"></div>

        <main class="main-content" id="mainContent">
            <div class="notifications-container">
                <div class="notifications-header">
                    <h3>🔔 همه اعلان‌ها (<span id="totalCount">0</span>)</h3>
                    <div class="notifications-actions">
                        <button class="btn btn-primary" onclick="markAllRead()"><i class="fas fa-check-double"></i> خواندن همه</button>
                        <button class="btn btn-secondary" onclick="markAllUnread()"><i class="fas fa-undo"></i> نخوانده کردن همه</button>
                        <button class="btn btn-info" onclick="loadNotifications()"><i class="fas fa-sync-alt"></i> بازخوانی</button>
                    </div>
                </div>

                <div class="notifications-filters">
                    <button class="filter-btn active" data-filter="all" onclick="filterNotifications('all')">همه</button>
                    <button class="filter-btn" data-filter="unread" onclick="filterNotifications('unread')">خوانده نشده (<span id="unreadCount">0</span>)</button>
                    <button class="filter-btn" data-filter="read" onclick="filterNotifications('read')">خوانده شده</button>
                </div>

                <div class="notifications-list" id="notificationsList">
                    <div class="loading">در حال بارگذاری...</div>
                </div>
            </div>

            <div id="footerContainer"></div>
        </main>
    </div>

    <script src="i18n.js?v=3"></script>
    <script src="i18n-literals.js?v=1"></script>
    <script src="database.js?v=20261101"></script>
    <script src="app.js"></script>
    <script src="components/loader.js?v=20261101"></script>
    
    <script>
    // ============================================
    // ⭐ تعریف مستقیم توابع در همین فایل (بدون وابستگی به component-utils.js)
    // ============================================
    const NOTIF_API = window.NCR_API + '/';
    let allNotifications = [];
    let currentFilter = 'all';
    let currentUserId = 0;

    // گرفتن user_id با اولویت مطلق
    function getUid() {
        const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
        if (!user) return 0;
        const uid = parseInt(user.id || 0);
        console.log('👤 getUid() =', uid, '| full user:', user);
        return uid;
    }

    // ⭐ به‌روزرسانی بج‌ها - مستقل
    window.updateNotifications = async function() {
        const userId = getUid();
        if (!userId) { console.warn('⚠️ no userId'); return; }
        try {
            const res = await fetch(NOTIF_API + 'get_notifications.php?user_id=' + userId);
            const data = await res.json();
            console.log('🔔 updateNotifications response:', data);
            if (!data.success) return;
            const notifs = data.data || [];
            const unread = notifs.filter(n => !n.is_read || n.is_read == 0).length;
            console.log('🔔 unread count:', unread);

            // بج هدر
            const headerBadge = document.getElementById('notificationBadge');
            if (headerBadge) {
                if (unread > 0) {
                    headerBadge.textContent = unread > 99 ? '99+' : String(unread);
                    headerBadge.style.display = 'flex';
                } else {
                    headerBadge.textContent = '0';
                    headerBadge.style.display = 'none';
                }
            }
            // بج سایدبار
            const sideBadge = document.getElementById('sidebarNotificationBadge');
            if (sideBadge) {
                if (unread > 0) {
                    sideBadge.textContent = unread > 99 ? '99+' : String(unread);
                    sideBadge.style.display = 'inline-flex';
                } else {
                    sideBadge.style.display = 'none';
                }
            }
        } catch (e) { console.error('❌ updateNotifications:', e); }
    };

    // ⭐ بارگذاری dropdown
    window.loadNotifications = async function() {
        const list = document.getElementById('notificationList');
        if (!list) return;
        const userId = getUid();
        if (!userId) return;
        try {
            const res = await fetch(NOTIF_API + 'get_notifications.php?user_id=' + userId);
            const data = await res.json();
            if (!data.success) { list.innerHTML = '<div class="no-notifications">خطا</div>'; return; }
            const notifs = data.data || [];
            if (notifs.length === 0) { list.innerHTML = '<div class="no-notifications">هیچ اعلانی وجود ندارد</div>'; return; }
            const icons = { info:'fa-info-circle', success:'fa-check-circle', warning:'fa-exclamation-triangle', danger:'fa-exclamation-circle' };
            list.innerHTML = notifs.slice(0,5).map(n => 
                '<div class="notification-item ' + (n.is_read?'':'unread') + '" onclick="handleNotificationClick(' + n.id + ',\'' + (n.link||'') + '\')">' +
                '<div class="notification-icon ' + n.type + '"><i class="fas ' + (icons[n.type]||'fa-info-circle') + '"></i></div>' +
                '<div class="notification-content"><div class="notification-title">' + n.title + '</div>' +
                '<div class="notification-message">' + n.message + '</div>' +
                '<div class="notification-time">' + n.created_at + '</div></div></div>'
            ).join('');
        } catch(e) { console.error(e); }
    };

    // ⭐ کلیک روی اعلان
    window.handleNotificationClick = async function(id, link) {
        const userId = getUid();
        if (!userId) return;
        try {
            await fetch(NOTIF_API + 'mark_notification_read.php', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ notification_id: id, user_id: userId })
            });
            updateNotifications();
        } catch(e) { console.error(e); }
        if (link) setTimeout(() => window.location.href = link, 300);
    };

    // ⭐ بارگذاری کامپوننت‌ها
    async function loadComponent(name, target) {
        try {
            const res = await fetch('components/' + name + '.html');
            const html = await res.text();
            const el = document.getElementById(target);
            if (el) el.innerHTML = html;
        } catch(e) { console.error('loadComponent', name, e); }
    }

    async function loadAll() {
        await loadComponent('header', 'headerContainer');
        await loadComponent('sidebar', 'sidebarContainer');
        await loadComponent('footer', 'footerContainer');
        // بعد از لود، توابع هدر را تنظیم کن
        window.toggleNotifications = function() {
            const dd = document.getElementById('notificationsDropdown');
            if (dd) { dd.classList.toggle('show'); loadNotifications(); }
        };
        window.toggleUserMenu = function() {
            const dd = document.getElementById('userDropdown');
            if (dd) dd.classList.toggle('show');
        };
        window.changePassword = function() { window.location.href = 'change-password.html'; };
        window.logout = function() { localStorage.removeItem('currentUser'); window.location.href = 'index.html'; };
        window.toggleSidebar = function() {
            const sb = document.getElementById('sidebar');
            const mc = document.getElementById('mainContent');
            if (sb) sb.classList.toggle('collapsed');
            if (mc) mc.classList.toggle('expanded');
        };
        // تاریخ
        const d = new Date();
        const dateEl = document.getElementById('currentDate');
        if (dateEl) dateEl.textContent = d.toLocaleDateString('fa-IR');
        // نام کاربر
        const u = JSON.parse(localStorage.getItem('currentUser') || 'null');
        const nameEl = document.getElementById('userName');
        if (u && nameEl) nameEl.textContent = u.full_name;
        // زبان
        const lang = localStorage.getItem('userLanguage') || 'fa';
        const sel = document.getElementById('languageSelector');
        if (sel) sel.value = lang;

        // ⭐ به‌روزرسانی بج‌ها بعد از لود سایدبار
        updateNotifications();
    }

    // ============================================
    // صفحه اعلان‌ها
    // ============================================
    document.addEventListener('DOMContentLoaded', async function() {
        const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
        if (!user) { window.location.href = 'index.html'; return; }
        currentUserId = parseInt(user.id || 0);
        console.log('👤 notifications page - currentUserId:', currentUserId);

        // لود کامپوننت‌ها (هدر و سایدبار)
        await loadAll();

        // لود اعلان‌ها
        await loadNotificationsPage();
    });

    async function loadNotificationsPage() {
        const container = document.getElementById('notificationsList');
        container.innerHTML = '<div class="loading">در حال بارگذاری...</div>';

        try {
            const res = await fetch(NOTIF_API + 'get_notifications.php?user_id=' + currentUserId);
            const result = await res.json();
            console.log('📋 notifications response:', result);

            if (result.success) {
                allNotifications = result.data || [];
                console.log('📋 loaded:', allNotifications.length);
                updatePageCounts();
                renderNotificationsPage(currentFilter);
            } else {
                container.innerHTML = '<div class="no-notifications"><i class="fas fa-exclamation-triangle"></i><p>خطا: ' + (result.error||'') + '</p></div>';
            }
        } catch(e) {
            console.error(e);
            container.innerHTML = '<div class="no-notifications"><i class="fas fa-wifi"></i><p>خطا در ارتباط با سرور</p></div>';
        }
    }

    function updatePageCounts() {
        const unread = allNotifications.filter(n => !n.is_read || n.is_read == 0).length;
        const total = allNotifications.length;
        const tc = document.getElementById('totalCount');
        const uc = document.getElementById('unreadCount');
        if (tc) tc.textContent = total;
        if (uc) uc.textContent = unread;

        // بج هدر
        const hb = document.getElementById('notificationBadge');
        if (hb) {
            if (unread > 0) { hb.textContent = unread>99?'99+':String(unread); hb.style.display='flex'; }
            else { hb.style.display = 'none'; }
        }
        // بج سایدبار
        const sb = document.getElementById('sidebarNotificationBadge');
        if (sb) {
            if (unread > 0) { sb.textContent = unread>99?'99+':String(unread); sb.style.display='inline-flex'; }
            else { sb.style.display = 'none'; }
        }
    }

function renderNotificationsPage(filter) {
    const container = document.getElementById('notificationsList');
    let filtered = allNotifications;
    if (filter === 'unread') filtered = allNotifications.filter(n => !n.is_read || n.is_read == 0);
    else if (filter === 'read') filtered = allNotifications.filter(n => n.is_read == 1);

    if (filtered.length === 0) {
        container.innerHTML = '<div class="no-notifications"><i class="fas fa-bell-slash"></i><p>هیچ اعلانی در این دسته وجود ندارد</p></div>';
        return;
    }
    const icons = { info:'fa-info-circle', success:'fa-check-circle', warning:'fa-exclamation-triangle', danger:'fa-times-circle' };
    container.innerHTML = filtered.map(n => {
        const isRead = n.is_read == 1;
        // ⭐ فرار از کوتیشن‌ها در لینک
        const safeLink = (n.link || '').replace(/'/g, "\\'");
        return `
            <div class="notification-item ${isRead?'read':'unread'}" 
                 onclick="handlePageNotificationClick(${n.id}, '${safeLink}', ${isRead})"
                 style="cursor:pointer;">
                ${!isRead ? '<span class="unread-badge">جدید</span>' : ''}
                <div class="notification-icon ${n.type}"><i class="fas ${icons[n.type]||'fa-info-circle'}"></i></div>
                <div class="notification-content">
                    <div class="notification-title">${n.title}</div>
                    <div class="notification-message">${n.message}</div>
                    <div class="notification-time">${n.created_at}${n.link?' <a href="#" onclick="event.stopPropagation(); event.preventDefault(); handlePageNotificationClick('+n.id+', 						\''+safeLink+'\', '+isRead+');">مشاهده</a>':''}</div>
                </div>
                <div class="notification-actions">
                    <button class="toggle-read-btn" onclick="event.stopPropagation(); toggleReadPage(${n.id}, ${isRead?0:1})">
                        <i class="fas ${isRead?'fa-envelope':'fa-envelope-open'}"></i>
                        ${isRead?'خوانده':'نخوانده'}
                    </button>
                </div>
            </div>`;
    }).join('');
}

// ⭐ تابع جدید: کلیک روی ردیف اعلان در صفحه
async function handlePageNotificationClick(id, link, isRead) {
    // اگر نخوانده بود، آن را خوانده کن
    if (!isRead) {
        try {
            const res = await fetch(NOTIF_API + 'mark_notification_read.php', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ notification_id: id, user_id: currentUserId })
            });
            const r = await res.json();
            if (r.success) {
                // ⭐ آپدیت localStorage
                const n = allNotifications.find(x => x.id === id);
                if (n) n.is_read = 1;
                
                // ⭐ آپدیت UI
                updatePageCounts();
                renderNotificationsPage(currentFilter);
                
                // ⭐ آپدیت بج هدر و سایدبار
                if (typeof updateNotifications === 'function') {
                    updateNotifications();
                }
            }
        } catch (e) {
            console.error('❌ handlePageNotificationClick:', e);
        }
    }
    
    // اگر لینک دارد، به آن برو
    if (link) {
        setTimeout(() => { window.location.href = link; }, 200);
    }
}

// صادرات به window
window.handlePageNotificationClick = handlePageNotificationClick;
        
    async function toggleReadPage(id, newState) {
        try {
            const res = await fetch(NOTIF_API + 'toggle_notification_read.php', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ notification_id: id, user_id: currentUserId, is_read: newState })
            });
            const r = await res.json();
            if (r.success) {
                const n = allNotifications.find(x => x.id === id);
                if (n) n.is_read = newState;
                updatePageCounts();
                renderNotificationsPage(currentFilter);
            }
        } catch(e) { console.error(e); }
    }

    async function markAllRead() {
        if (!confirm('همه به عنوان خوانده شده؟')) return;
        try {
            const res = await fetch(NOTIF_API + 'mark_all_notifications_read.php', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ user_id: currentUserId })
            });
            const r = await res.json();
            if (r.success) {
                allNotifications.forEach(n => n.is_read = 1);
                updatePageCounts();
                renderNotificationsPage(currentFilter);
            }
        } catch(e) { console.error(e); }
    }

    async function markAllUnread() {
        if (!confirm('همه به عنوان نخوانده؟')) return;
        try {
            const promises = allNotifications.filter(n => n.is_read == 1).map(n =>
                fetch(NOTIF_API + 'toggle_notification_read.php', {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ notification_id: n.id, user_id: currentUserId, is_read: 0 })
                })
            );
            await Promise.all(promises);
            allNotifications.forEach(n => n.is_read = 0);
            updatePageCounts();
            renderNotificationsPage(currentFilter);
        } catch(e) { console.error(e); }
    }

    function filterNotifications(filter) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === filter));
        renderNotificationsPage(filter);
    }

    // صادرات به window
    window.toggleReadPage = toggleReadPage;
    window.markAllRead = markAllRead;
    window.markAllUnread = markAllUnread;
    window.filterNotifications = filterNotifications;
    window.loadNotifications = loadNotifications;
    </script>
</body>
</html>

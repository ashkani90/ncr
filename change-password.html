<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="change_password_title">تغییر رمز عبور</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .password-page {
            max-width: 620px;
            margin: 0 auto;
        }

        .password-card {
            background: #fff;
            border: 1px solid #eef0f4;
            border-radius: 16px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
            padding: 28px;
        }

        .password-head {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 22px;
        }

        .password-head-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: #eef2ff;
            color: #5468e7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .password-head h2 {
            margin: 0;
            font-size: 19px;
            color: #1f2d3d;
        }

        .password-head p {
            margin: 4px 0 0;
            color: #6c757d;
            font-size: 12.5px;
            line-height: 1.7;
        }

        .password-card .form-group {
            margin-bottom: 18px;
        }

        .password-field {
            position: relative;
        }

        .password-field input {
            padding-left: 44px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            left: 10px;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #98a2b3;
            cursor: pointer;
            font-size: 15px;
            padding: 4px;
        }

        html.ltr .password-field input {
            padding-left: 12px;
            padding-right: 44px;
        }

        html.ltr .toggle-password {
            left: auto;
            right: 10px;
        }

        .strength {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .strength span {
            height: 5px;
            flex: 1;
            border-radius: 4px;
            background: #e9edf3;
            transition: background 0.2s;
        }

        .strength.level-1 span:nth-child(1) { background: #e74c3c; }
        .strength.level-2 span:nth-child(-n+2) { background: #f39c12; }
        .strength.level-3 span { background: #27ae60; }

        .password-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 24px;
        }

        .password-actions .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        @media (max-width: 768px) {
            .password-card {
                padding: 20px;
            }

            .password-actions .btn {
                flex: 1 1 100%;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="headerContainer"></div>
        <div id="sidebarContainer"></div>

        <main class="main-content" id="mainContent">
            <div class="password-page">
                <div class="password-card">
                    <div class="password-head">
                        <div class="password-head-icon"><i class="fas fa-shield-halved"></i></div>
                        <div>
                            <h2 data-i18n="change_password_title">تغییر رمز عبور</h2>
                            <p data-i18n="security_tip">برای امنیت بیشتر از رمز قوی شامل حروف، اعداد و نمادها استفاده کنید</p>
                        </div>
                    </div>

                    <form id="passwordForm" autocomplete="off">
                        <div class="form-group">
                            <label data-i18n="current_password">رمز عبور فعلی</label>
                            <div class="password-field">
                                <input type="password" id="currentPassword" required autocomplete="current-password">
                                <button type="button" class="toggle-password" onclick="togglePassword('currentPassword', this)" tabindex="-1">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label data-i18n="new_password">رمز عبور جدید</label>
                            <div class="password-field">
                                <input type="password" id="newPassword" required autocomplete="new-password" oninput="updateStrength(this.value)">
                                <button type="button" class="toggle-password" onclick="togglePassword('newPassword', this)" tabindex="-1">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <div class="strength" id="strengthBar">
                                <span></span><span></span><span></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label data-i18n="confirm_password">تکرار رمز عبور جدید</label>
                            <div class="password-field">
                                <input type="password" id="confirmPassword" required autocomplete="new-password">
                                <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)" tabindex="-1">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="password-actions">
                            <a href="profile.html" class="btn btn-secondary">
                                <i class="fas fa-arrow-right"></i> <span data-i18n="profile">پروفایل</span>
                            </a>                            
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-key"></i> <span data-i18n="change_password_title">تغییر رمز عبور</span>
                            </button>

                        </div>
                    </form>
                </div>
            </div>

            <div id="footerContainer"></div>
        </main>
    </div>

    <script src="i18n.js?v=3"></script>
    <script src="i18n-literals.js?v=1"></script>
    <script src="database.js?v=20261101"></script>
    <script src="permissions.js?v=20261101"></script>
    <script src="app.js"></script>
    <script src="components/loader.js?v=20261101"></script>

    <script>
        // ============================================
        // تغییر رمز عبور
        // ============================================
        function i18nText(key, fallback) {
            if (window.t) {
                var value = window.t(key);
                if (value && value !== key) return value;
            }
            return fallback || key;
        }

        function togglePassword(inputId, button) {
            var input = document.getElementById(inputId);
            if (!input) return;
            var icon = button ? button.querySelector('i') : null;

            if (input.type === 'password') {
                input.type = 'text';
                if (icon) icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                if (icon) icon.className = 'fas fa-eye';
            }
        }

        function updateStrength(value) {
            var bar = document.getElementById('strengthBar');
            if (!bar) return;

            bar.className = 'strength';
            if (!value) return;

            var score = 0;
            if (value.length >= 6) score++;
            if (value.length >= 10) score++;
            if (/[0-9]/.test(value) && /[A-Za-z]/.test(value)) score++;

            if (score > 0) bar.classList.add('level-' + Math.min(score, 3));
        }

        function showToast(message, type) {
            if (typeof window.showNotification === 'function') {
                window.showNotification(message, type);
                return;
            }
            var colors = { success: '#27ae60', error: '#e74c3c', warning: '#f39c12', info: '#3498db' };
            var el = document.createElement('div');
            el.style.cssText = 'position:fixed;top:80px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:10px;color:#fff;font-weight:600;z-index:9999;background:' + (colors[type] || '#3498db');
            el.textContent = message;
            document.body.appendChild(el);
            setTimeout(function () { el.remove(); }, 3000);
        }

        async function submitPassword(event) {
            event.preventDefault();

            var currentPassword = document.getElementById('currentPassword').value;
            var newPassword = document.getElementById('newPassword').value;
            var confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                showToast(i18nText('password_mismatch', 'رمز عبور جدید و تکرار آن یکسان نیستند'), 'error');
                return;
            }

            if (newPassword.length < 6) {
                showToast(i18nText('password_min', 'رمز عبور باید حداقل ۶ کاراکتر باشد'), 'error');
                return;
            }

            if (newPassword === currentPassword) {
                showToast('رمز عبور جدید باید با رمز فعلی متفاوت باشد.', 'error');
                return;
            }

            var currentUser = null;
            try { currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null'); } catch (e) { currentUser = null; }

            if (!currentUser || !currentUser.id) {
                window.location.href = 'index.html';
                return;
            }

            try {
                var response = await fetch(window.NCR_API + '/change_password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        current_password: currentPassword,
                        new_password: newPassword
                    })
                });
                var result = await response.json();

                if (!result.success) {
                    var message = result.error || 'خطا در تغییر رمز عبور';
                    if (message.indexOf('فعلی') !== -1) {
                        message = i18nText('wrong_current_password', message);
                    }
                    showToast(message, 'error');
                    return;
                }

                currentUser.password = newPassword;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));

                document.getElementById('passwordForm').reset();
                updateStrength('');
                showToast(i18nText('password_changed', 'رمز عبور با موفقیت تغییر کرد'), 'success');

                setTimeout(function () {
                    window.location.href = 'profile.html';
                }, 1600);
            } catch (e) {
                console.error('❌ Change password failed:', e);
                showToast('خطا در ارتباط با سرور.', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            var form = document.getElementById('passwordForm');
            if (form) form.addEventListener('submit', submitPassword);
        });
    </script>
</body>
</html>

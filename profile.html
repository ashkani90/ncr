<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="profile">پروفایل کاربری</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .profile-page {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            gap: 20px;
        }

        .profile-card {
            background: #fff;
            border: 1px solid #eef0f4;
            border-radius: 16px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
            padding: 26px;
        }

        .profile-actions-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .profile-hero {
            display: flex;
            align-items: center;
            gap: 22px;
            flex-wrap: wrap;
        }

        .profile-avatar-lg {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #eef2ff;
            background: #f4f6fb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #adb5bd;
            font-size: 42px;
            flex-shrink: 0;
        }

        .profile-avatar-lg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-actions-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-start;
        }

        .avatar-actions-col small {
            color: #8a94a6;
            font-size: 11px;
        }

        .profile-name h2 {
            margin: 0;
            font-size: 21px;
            color: #1f2d3d;
        }

        .profile-name p {
            margin: 4px 0 0;
            color: #6c757d;
            font-size: 13px;
        }

        .role-pill {
            display: inline-block;
            margin-top: 10px;
            padding: 4px 14px;
            border-radius: 20px;
            background: #eef2ff;
            color: #4c6ef5;
            font-size: 12px;
            font-weight: 700;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 18px;
            font-size: 16px;
            color: #2c3e50;
            font-weight: 700;
        }

        .section-title i {
            color: #667eea;
        }

        .profile-page .form-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .profile-page .form-group input[readonly] {
            background: #f8f9fb;
            color: #6c757d;
        }

        @media (max-width: 768px) {
            .profile-card {
                padding: 18px;
            }

            .profile-hero {
                align-items: flex-start;
            }

            .profile-avatar-lg {
                width: 88px;
                height: 88px;
                font-size: 34px;
            }

            .profile-actions-row .btn {
                flex: 1 1 auto;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="headerContainer"></div>
        <div id="sidebarContainer"></div>

        <main class="main-content" id="mainContent">
            <div class="profile-page">
                <!-- کارت هویت کاربر -->
                <div class="profile-card">
                    <div class="profile-actions-row">

                        <a href="dashboard.html" class="btn btn-secondary">
                            <i class="fas fa-arrow-right"></i> <span data-i18n="back_to_dashboard">بازگشت به داشبورد</span>
                        </a>
                    </div>

                    <div class="profile-hero">
                        <div class="profile-avatar-lg" id="profileAvatarPreview">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="avatar-actions-col">
                            <label for="profileAvatarFile" class="btn btn-primary btn-sm" style="cursor:pointer;">
                                <i class="fas fa-camera"></i> <span data-i18n="upload_photo">انتخاب تصویر</span>
                            </label>
                            <input type="file" id="profileAvatarFile" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
                            <button type="button" id="removeProfileAvatarBtn" class="btn btn-secondary btn-sm" onclick="removeProfileAvatar()" style="display:none;">
                                <i class="fas fa-trash"></i> <span data-i18n="remove_photo">حذف تصویر</span>
                            </button>
                            <small data-i18n="avatar_help">فرمت JPG/PNG - حداکثر ۲ مگابایت</small>
                        </div>

                        <div class="profile-name">
                            <h2 id="profileFullName">—</h2>
                            <p id="profileUsername" dir="ltr">@—</p>
                            <span class="role-pill" id="profileRole">—</span>
                        </div>
                        <a href="change-password.html" class="btn btn-warning" style="margin-right: 290px;">
                            <i class="fas fa-key" ></i> <span data-i18n="change_password_title">تغییر رمز عبور</span>
                        </a>                        
                    </div>
                </div>

                <!-- کارت اطلاعات شخصی -->
                <div class="profile-card">
                    <h3 class="section-title"><i class="fas fa-id-card"></i> <span data-i18n="personal_info">اطلاعات شخصی</span></h3>

                    <form id="profileForm">
                        <div class="form-grid">
                            <div class="form-group">
                                <label data-i18n="username_label">نام کاربری</label>
                                <input type="text" id="username" readonly dir="ltr">
                            </div>
                            <div class="form-group">
                                <label>نام و نام خانوادگی <span class="required">*</span></label>
                                <input type="text" id="fullName" required>
                            </div>
                            <div class="form-group">
                                <label>ایمیل</label>
                                <input type="email" id="email" dir="ltr" placeholder="example@domain.com">
                            </div>
                            <div class="form-group">
                                <label data-i18n="department">دپارتمان</label>
                                <select id="department">
                                    <option value="">انتخاب کنید</option>
                                    <option value="مدیریت">مدیریت</option>
                                    <option value="کنترل کیفیت">کنترل کیفیت</option>
                                    <option value="تولید">تولید</option>
                                    <option value="انبار">انبار</option>
                                    <option value="مهندسی">مهندسی</option>
                                    <option value="خرید">خرید</option>
                                    <option value="خدمات پس از فروش">خدمات پس از فروش</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label data-i18n="language">زبان</label>
                                <select id="language">
                                    <option value="fa">فارسی</option>
                                    <option value="en">English</option>
                                    <option value="zh">中文</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>نقش</label>
                                <input type="text" id="roleDisplay" readonly>
                            </div>
                        </div>

                        <input type="hidden" id="avatarPath" value="">

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> <span data-i18n="save_changes">ذخیره تغییرات</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div id="footerContainer"></div>
        </main>
    </div>

    <script src="i18n.js?v=3"></script>
    <script src="i18n-literals.js?v=1"></script>
    <script src="database.js?v=20261101"></script>
    <script src="permissions.js?v=20261101"></script>
    <script src="app.js"></script>
    <script src="components/loader.js?v=20261101"></script>

    <script>
        // ============================================
        // پروفایل کاربری
        // ============================================
        var profileUser = null;

        function i18nText(key, fallback) {
            if (window.t) {
                var value = window.t(key);
                if (value && value !== key) return value;
            }
            return fallback || key;
        }

        function avatarFullUrl(path) {
            if (!path) return '';
            if (/^(https?:|data:|\/)/.test(path)) return path;
            return (window.NCR_ROOT || '') + path;
        }

        function setProfileAvatar(path) {
            var preview = document.getElementById('profileAvatarPreview');
            var hidden = document.getElementById('avatarPath');
            var removeBtn = document.getElementById('removeProfileAvatarBtn');
            if (!preview || !hidden) return;

            hidden.value = path || '';

            if (path) {
                preview.innerHTML = '<img src="' + avatarFullUrl(path) + '" alt="avatar">';
                if (removeBtn) removeBtn.style.display = 'inline-flex';
            } else {
                preview.innerHTML = '<i class="fas fa-user"></i>';
                if (removeBtn) removeBtn.style.display = 'none';
            }
        }

        function removeProfileAvatar() {
            setProfileAvatar('');
            var input = document.getElementById('profileAvatarFile');
            if (input) input.value = '';
        }

        async function uploadProfileAvatar() {
            var input = document.getElementById('profileAvatarFile');
            if (!input || !input.files || !input.files[0]) return;

            var file = input.files[0];
            if (!/^image\//.test(file.type)) {
                showToast('فقط فایل تصویری مجاز است.', 'error');
                return;
            }
            if (file.size > 2 * 1024 * 1024) {
                showToast('حجم تصویر نباید بیشتر از ۲ مگابایت باشد.', 'error');
                return;
            }

            var formData = new FormData();
            formData.append('avatar', file);

            try {
                var response = await fetch(window.NCR_API + '/upload_avatar.php', { method: 'POST', body: formData });
                var result = await response.json();
                if (result.success) {
                    setProfileAvatar(result.path);
                    showToast('تصویر پروفایل بارگذاری شد.', 'success');
                } else {
                    showToast(result.error || 'خطا در بارگذاری تصویر.', 'error');
                }
            } catch (e) {
                console.error('❌ Avatar upload failed:', e);
                showToast('خطا در ارتباط با سرور.', 'error');
            }
        }

        async function loadProfile(currentUser) {
            var user = currentUser;

            try {
                var response = await fetch(window.NCR_API + '/get_users.php', { cache: 'no-store' });
                var result = await response.json();
                if (result && result.success && Array.isArray(result.data)) {
                    var found = result.data.filter(function (u) { return String(u.id) === String(currentUser.id); })[0];
                    if (found) user = Object.assign({}, currentUser, found);
                }
            } catch (e) {
                console.warn('⚠️ دریافت اطلاعات پروفایل از سرور ناموفق بود:', e);
            }

            profileUser = user;

            document.getElementById('username').value = user.username || '';
            document.getElementById('fullName').value = user.full_name || '';
            document.getElementById('email').value = user.email || '';
            document.getElementById('department').value = user.department || '';
            document.getElementById('language').value = user.language || 'fa';
            document.getElementById('roleDisplay').value = user.role_description || user.role || '';

            document.getElementById('profileFullName').textContent = user.full_name || '—';
            document.getElementById('profileUsername').textContent = '@' + (user.username || '—');
            document.getElementById('profileRole').textContent = user.role_description || user.role || '—';

            ensureDepartmentOption(user.department);
            setProfileAvatar(user.avatar || '');
        }

        function ensureDepartmentOption(department) {
            if (!department) return;
            var select = document.getElementById('department');
            var exists = Array.prototype.some.call(select.options, function (option) {
                return option.value === department;
            });
            if (!exists) {
                var option = document.createElement('option');
                option.value = department;
                option.textContent = department;
                select.appendChild(option);
            }
        }

        async function saveProfile(event) {
            event.preventDefault();
            if (!profileUser) return;

            var fullName = document.getElementById('fullName').value.trim();
            var email = document.getElementById('email').value.trim();
            var department = document.getElementById('department').value;
            var language = document.getElementById('language').value;
            var avatar = document.getElementById('avatarPath').value || '';

            if (!fullName) {
                showToast('نام و نام خانوادگی الزامی است.', 'error');
                return;
            }

            var payload = {
                id: profileUser.id,
                full_name: fullName,
                email: email,
                role: profileUser.role,
                department: department,
                language: language,
                avatar: avatar
            };

            try {
                var response = await fetch(window.NCR_API + '/get_users.php', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                var result = await response.json();

                if (!result.success) {
                    showToast(result.error || 'خطا در ذخیره پروفایل.', 'error');
                    return;
                }

                // به‌روزرسانی جلسه و هدر
                profileUser.full_name = fullName;
                profileUser.email = email;
                profileUser.department = department;
                profileUser.language = language;
                profileUser.avatar = avatar;

                var sessionUser = JSON.parse(localStorage.getItem('currentUser') || 'null') || {};
                Object.assign(sessionUser, {
                    full_name: fullName,
                    email: email,
                    department: department,
                    language: language,
                    avatar: avatar
                });
                localStorage.setItem('currentUser', JSON.stringify(sessionUser));

                document.getElementById('profileFullName').textContent = fullName;
                var headerName = document.getElementById('userName');
                if (headerName) headerName.textContent = fullName;
                if (window.updateHeaderAvatar) window.updateHeaderAvatar(sessionUser);

                if (language) {
                    localStorage.setItem('userLanguage', language);
                    if (window.setLanguage) window.setLanguage(language);
                }

                showToast(i18nText('profile_saved', 'پروفایل با موفقیت ذخیره شد'), 'success');
            } catch (e) {
                console.error('❌ Save profile failed:', e);
                showToast('خطا در ارتباط با سرور.', 'error');
            }
        }

        function showToast(message, type) {
            if (typeof window.showNotification === 'function') {
                window.showNotification(message, type);
                return;
            }
            var colors = { success: '#27ae60', error: '#e74c3c', warning: '#f39c12', info: '#3498db' };
            var el = document.createElement('div');
            el.style.cssText = 'position:fixed;top:80px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:10px;color:#fff;font-weight:600;z-index:9999;background:' + (colors[type] || '#3498db');
            el.textContent = message;
            document.body.appendChild(el);
            setTimeout(function () { el.remove(); }, 3000);
        }

        document.addEventListener('DOMContentLoaded', function () {
            var currentUser = null;
            try { currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null'); } catch (e) { currentUser = null; }

            if (!currentUser) {
                window.location.href = 'index.html';
                return;
            }

            loadProfile(currentUser);

            var avatarInput = document.getElementById('profileAvatarFile');
            if (avatarInput) avatarInput.addEventListener('change', uploadProfileAvatar);

            var form = document.getElementById('profileForm');
            if (form) form.addEventListener('submit', saveProfile);
        });

        window.removeProfileAvatar = removeProfileAvatar;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="ca_list_title">لیست اقدامات اصلاحی</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="list-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <div id="headerContainer"></div>
        <div id="sidebarContainer"></div>

        <main class="main-content" id="mainContent">
            <!-- فیلترها -->
            <div class="filter-section">
                <div class="filter-grid">
                    <div class="form-group">
                        <label data-i18n="search">جستجو</label>
                        <input type="text" id="searchInput" placeholder="جستجو در شماره فرم، موضوع..." data-i18n-placeholder="search_placeholder" oninput="applyFilters()">
                    </div>
                    <div class="form-group">
                        <label data-i18n="status">وضعیت</label>
                        <select id="statusFilter" onchange="applyFilters()">
                            <option value="" data-i18n="all_statuses">همه وضعیت‌ها</option>
                            <option value="draft" data-i18n="ca_status_draft">پیش‌نویس</option>
                            <option value="pending_manager" data-i18n="ca_status_pending_manager">در انتظار تأیید مدیر</option>
                            <option value="pending_quality" data-i18n="ca_status_pending_quality">در انتظار تأیید کیفیت</option>
                            <option value="pending_implementation" data-i18n="ca_status_pending_implementation">در حال اجرا</option>
                            <option value="pending_verification" data-i18n="ca_status_pending_verification">در انتظار پایش</option>
                            <option value="closed" data-i18n="ca_status_closed">بسته شده</option>
                            <option value="rejected" data-i18n="ca_status_rejected">رد شده</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="priority">اولویت</label>
                        <select id="priorityFilter" onchange="applyFilters()">
                            <option value="" data-i18n="all_priorities">همه اولویت‌ها</option>
                            <option value="critical" data-i18n="priority_critical">بحرانی</option>
                            <option value="high" data-i18n="priority_high">بالا</option>
                            <option value="medium" data-i18n="priority_medium">متوسط</option>
                            <option value="low" data-i18n="priority_low">کم</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="date_from">تاریخ از</label>
                        <input type="date" id="dateFrom" onchange="applyFilters()">
                    </div>
                    <div class="form-group">
                        <label data-i18n="date_to">تاریخ تا</label>
                        <input type="date" id="dateTo" onchange="applyFilters()">
                    </div>
                    <div class="form-group">
                        <label data-i18n="department">دپارتمان</label>
                        <select id="departmentFilter" onchange="applyFilters()">
                            <option value="">همه دپارتمان‌ها</option>
                        </select>
                    </div>
                </div>
                <div class="filter-actions">
                    <button class="btn btn-secondary" onclick="resetFilters()"><i class="fas fa-undo"></i> <span data-i18n="reset">بازنشانی</span></button>
                    <button class="btn btn-success" onclick="exportData()"><i class="fas fa-file-excel"></i> <span data-i18n="export_excel">خروجی اکسل</span></button>
                    <button class="btn btn-warning" onclick="printPage()"><i class="fas fa-print"></i> <span data-i18n="print">چاپ</span></button>
                </div>
            </div>

            <!-- جدول اقدامات اصلاحی -->
            <div class="table-container">
                <div class="print-only">
                    <h2 data-i18n="ca_list_title">لیست اقدامات اصلاحی</h2>
                    <p id="printMeta"></p>
                </div>
                <div class="table-header">
                    <h3><i class="fas fa-tasks"></i> <span data-i18n="list_cas_full">لیست فرم‌های اقدام اصلاحی</span></h3>
                    <span class="table-count" id="recordCount" data-i18n="count_label">تعداد</span>
                </div>
                <div style="overflow-x: auto;">
                    <table id="dataTable">
                        <thead>
                            <tr>
                                <th data-sort="actionNumber"><span data-i18n="form_number">شماره فرم</span> <i class="fas fa-sort sort-icon"></i></th>
                                <th data-sort="issueDate"><span data-i18n="issue_date">تاریخ صدور</span> <i class="fas fa-sort sort-icon"></i></th>
                                <th data-sort="subject"><span data-i18n="table_subject">موضوع</span> <i class="fas fa-sort sort-icon"></i></th>
                                <th data-sort="issuerName"><span data-i18n="issuer">صادرکننده</span> <i class="fas fa-sort sort-icon"></i></th>
                                <th data-sort="issuerDepartment"><span data-i18n="department">دپارتمان</span> <i class="fas fa-sort sort-icon"></i></th>
                                <th data-sort="linkedNCRNumber"><span data-i18n="linked_ncr">NCR مرتبط</span> <i class="fas fa-sort sort-icon"></i></th>
                                <th data-sort="priority"><span data-i18n="table_priority">اولویت</span> <i class="fas fa-sort sort-icon"></i></th>
                                <th data-sort="status"><span data-i18n="table_status">وضعیت</span> <i class="fas fa-sort sort-icon"></i></th>
                                <th class="no-print"><span data-i18n="table_actions">عملیات</span></th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr>
                                <td colspan="9" class="loading-row"><i class="fas fa-spinner fa-spin"></i> <span data-i18n="loading">در حال بارگذاری...</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="table-footer">
                    <div class="pagination">
                        <button onclick="listPage.prev()" aria-label="previous"><i class="fas fa-chevron-right"></i></button>
                        <span id="pageInfo" data-i18n="page_info">صفحه</span>
                        <button onclick="listPage.next()" aria-label="next"><i class="fas fa-chevron-left"></i></button>
                    </div>
                    <div class="page-size">
                        <label data-i18n="per_page">تعداد در صفحه</label>
                        <select id="pageSize" onchange="listPage.setPageSize(this.value)">
                            <option value="10">10</option>
                            <option value="25" selected>25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="footerContainer"></div>
        </main>
    </div>

    <script src="i18n.js?v=3"></script>
    <script src="i18n-literals.js?v=1"></script>
    <script src="database.js?v=20261101"></script>
    <script src="permissions.js?v=20261101"></script>
    <script src="app.js"></script>
    <script src="list-tools.js"></script>
    <script src="components/loader.js?v=20261101"></script>
    <script>
    // ============================================
    // لیست اقدامات اصلاحی (localStorage: corrective_actions)
    // ============================================
    var esc = window.ListTools.esc;
    var badge = window.ListTools.badge;
    var tr = window.ListTools.tr;

    var STATUS_MAP = {
        draft: { key: 'ca_status_draft', type: 'secondary' },
        pending_manager: { key: 'ca_status_pending_manager', type: 'info' },
        pending_quality: { key: 'ca_status_pending_quality', type: 'info' },
        pending_implementation: { key: 'ca_status_pending_implementation', type: 'warning' },
        pending_verification: { key: 'ca_status_pending_verification', type: 'warning' },
        closed: { key: 'ca_status_closed', type: 'success' },
        done: { key: 'status_completed', type: 'success' },
        rejected: { key: 'ca_status_rejected', type: 'danger' }
    };

    var PRIORITY_MAP = {
        critical: { key: 'priority_critical', type: 'danger' },
        high: { key: 'priority_high', type: 'danger' },
        medium: { key: 'priority_medium', type: 'warning' },
        low: { key: 'priority_low', type: 'info' }
    };

    var listPage = window.ListPage({
        tableId: 'dataTable',
        tbodyId: 'tableBody',
        countId: 'recordCount',
        defaultSort: 'issueDate',
        defaultSortDir: 'desc',
        columns: [
            {
                key: 'actionNumber',
                label: 'form_number',
                render: function (row) {
                    var num = row.actionNumber || '-';
                    return '<a class="link-primary" href="corrective-action.html?ca=' + encodeURIComponent(num) + '">' + esc(num) + '</a>';
                },
                text: function (row) { return row.actionNumber || ''; }
            },
            { key: 'issueDate', label: 'issue_date', render: function (row) { return esc(row.issueDate || '-'); } },
            { key: 'subject', label: 'table_subject', render: function (row) { return esc(row.subject || '-'); } },
            { key: 'issuerName', label: 'issuer', render: function (row) { return esc(row.issuerName || '-'); } },
            { key: 'issuerDepartment', label: 'department', render: function (row) { return esc(row.issuerDepartment || '-'); } },
            {
                key: 'linkedNCRNumber',
                label: 'linked_ncr',
                render: function (row) {
                    if (!row.linkedNCRNumber) return '-';
                    return '<a class="link-primary" href="new-ncr.html?number=' + encodeURIComponent(row.linkedNCRNumber) + '">' + esc(row.linkedNCRNumber) + '</a>';
                },
                text: function (row) { return row.linkedNCRNumber || ''; }
            },
            {
                key: 'priority',
                label: 'table_priority',
                render: function (row) {
                    var item = PRIORITY_MAP[row.priority];
                    return item ? badge(tr(item.key, row.priority), item.type) : esc(row.priority || '-');
                },
                text: function (row) {
                    var item = PRIORITY_MAP[row.priority];
                    return item ? tr(item.key, row.priority) : (row.priority || '');
                }
            },
            {
                key: 'status',
                label: 'table_status',
                render: function (row) {
                    var item = STATUS_MAP[row.status];
                    return item ? badge(tr(item.key, row.status), item.type) : esc(row.status || tr('ca_status_draft', 'پیش‌نویس'));
                },
                text: function (row) {
                    var item = STATUS_MAP[row.status];
                    return item ? tr(item.key, row.status) : (row.status || '');
                }
            },
            {
                label: 'table_actions',
                noExport: true,
                cellClass: 'no-print',
                render: function (row) {
                    var num = row.actionNumber || '';
                    var safeNum = String(num).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                    var editAllowed = canEditCA(row);
                    var deleteAllowed = canDeleteCA(row);
                    var html = '<div class="action-buttons">';

                    // مشاهده
                    html += '<a class="btn btn-primary btn-sm" title="' + esc(tr('view', 'مشاهده')) + '" href="corrective-action.html?ca=' + encodeURIComponent(num) + '"><i class="fas fa-eye"></i></a>';

                    // ویرایش (تا تکمیل‌نشدن مرحله بعد فعال است)
                    if (editAllowed) {
                        html += '<a class="btn btn-success btn-sm" title="ویرایش" href="corrective-action.html?ca=' + encodeURIComponent(num) + '"><i class="fas fa-edit"></i></a>';
                    } else {
                        html += '<button type="button" class="btn btn-success btn-sm btn-disabled" disabled title="پس از تکمیل مرحله بعد، ویرایش غیرفعال می‌شود"><i class="fas fa-edit"></i></button>';
                    }

                    // چاپ
                    html += '<button type="button" class="btn btn-print-list btn-sm" title="' + esc(tr('print', 'چاپ')) + '" onclick="printCA(\'' + safeNum + '\')"><i class="fas fa-print"></i></button>';

                    // حذف
                    if (deleteAllowed) {
                        html += '<button type="button" class="btn btn-danger btn-sm" title="حذف" onclick="deleteCA(\'' + safeNum + '\')"><i class="fas fa-trash"></i></button>';
                    } else {
                        html += '<button type="button" class="btn btn-danger btn-sm btn-disabled" disabled title="اجازه حذف این فرم را ندارید"><i class="fas fa-trash"></i></button>';
                    }

                    html += '</div>';
                    return html;
                }
            }
        ]
    });

    var allCAs = [];
    var currentUser = null;

    try {
        currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
    } catch (e) {
        currentUser = null;
    }

    if (!currentUser || !currentUser.role) {
        currentUser = { username: 'admin', role: 'admin', full_name: 'کاربر' };
    }

    // ============================================
    // قوانین ویرایش/حذف بر اساس وضعیت گردش کار
    // تا وقتی مرحله بعد تکمیل نشده، صاحب مرحله قبل می‌تواند ویرایش کند
    // ============================================
    function caIsCreator(ca) {
        return (currentUser.username && currentUser.username === ca.creatorUsername) ||
            (currentUser.full_name && currentUser.full_name === ca.issuerName);
    }

    function caRoleIsManager() {
        return ['supervisor', 'manager', 'admin'].indexOf(currentUser.role) !== -1;
    }

    function caRoleIsQuality() {
        return ['quality', 'admin'].indexOf(currentUser.role) !== -1;
    }

    function caIsTeamLeader(ca) {
        return (ca.teamLeader && currentUser.full_name === ca.teamLeader) ||
            (ca.teamLeader && currentUser.username === ca.teamLeader);
    }

    function canEditCA(ca) {
        var status = ca.status || 'draft';
        switch (status) {
            case 'draft':
            case 'rejected':
                return caIsCreator(ca) || caRoleIsQuality();
            case 'pending_manager':
                return caRoleIsManager() || caIsCreator(ca) || caRoleIsQuality();
            case 'pending_quality':
                return caRoleIsQuality() || caRoleIsManager();
            case 'pending_implementation':
                return caIsTeamLeader(ca) || caRoleIsQuality() || currentUser.role === 'admin';
            case 'pending_verification':
                return caRoleIsQuality() || caIsTeamLeader(ca) || currentUser.role === 'admin';
            default:
                return false;
        }
    }

    function canDeleteCA(ca) {
        return currentUser.role === 'admin' || caIsCreator(ca);
    }

    window.printCA = function (num) {
        window.open('corrective-action.html?ca=' + encodeURIComponent(num) + '&print=1', '_blank');
    };

    window.deleteCA = function (num) {
        if (!confirm('آیا از حذف فرم ' + num + ' مطمئن هستید؟')) return;

        var list = JSON.parse(localStorage.getItem('corrective_actions') || '[]');
        var filtered = list.filter(function (c) { return c.actionNumber !== num; });
        localStorage.setItem('corrective_actions', JSON.stringify(filtered));

        if (typeof window.showNotification === 'function') {
            window.showNotification('فرم ' + num + ' حذف شد.', 'success');
        }
        loadCorrectiveActions();
    };

    function filterValue(id) {
        var el = document.getElementById(id);
        return el ? String(el.value || '') : '';
    }

    // فرم‌هایی که کاربر جاری اجازه دیدن آن‌ها را دارد
    function filterByRole(cas) {
        var role = currentUser.role || '';
        if (role === 'admin' || role === 'quality') return cas;

        return cas.filter(function (ca) {
            if (role === 'supervisor' && ca.status === 'pending_manager') return true;
            if (ca.issuerName && ca.issuerName === currentUser.full_name) return true;
            if (ca.creatorUsername && ca.creatorUsername === currentUser.username) return true;
            if (ca.teamLeader && ca.teamLeader === currentUser.full_name && ca.status === 'pending_implementation') return true;
            return false;
        });
    }

    function populateDepartments() {
        var select = document.getElementById('departmentFilter');
        if (!select) return;

        var current = select.value;
        var departments = [];
        allCAs.forEach(function (ca) {
            var dept = (ca.issuerDepartment || '').trim();
            if (dept && departments.indexOf(dept) === -1) departments.push(dept);
        });
        departments.sort();

        var html = '<option value="">' + esc(tr('all_departments', 'همه دپارتمان‌ها')) + '</option>';
        departments.forEach(function (dept) {
            html += '<option value="' + esc(dept) + '">' + esc(dept) + '</option>';
        });
        select.innerHTML = html;

        if (departments.indexOf(current) !== -1) select.value = current;
    }

    function applyFilters() {
        var search = filterValue('searchInput').trim().toLowerCase();
        var status = filterValue('statusFilter');
        var priority = filterValue('priorityFilter');
        var dateFrom = filterValue('dateFrom');
        var dateTo = filterValue('dateTo');
        var department = filterValue('departmentFilter');

        var filtered = allCAs.filter(function (ca) {
            var searchable = [
                ca.actionNumber, ca.subject, ca.issuerName, ca.linkedNCRNumber,
                ca.problemDescription, ca.rootCause, ca.teamLeader
            ];

            var matchSearch = !search || searchable.some(function (field) {
                return String(field || '').toLowerCase().indexOf(search) !== -1;
            });

            var matchStatus = !status || (ca.status || '') === status;
            var matchPriority = !priority || (ca.priority || '') === priority;
            var matchDepartment = !department || (ca.issuerDepartment || '') === department;

            var date = ca.issueDate || '';
            var matchDate = (!dateFrom || (date && date >= dateFrom)) &&
                            (!dateTo || (date && date <= dateTo));

            return matchSearch && matchStatus && matchPriority && matchDepartment && matchDate;
        });

        listPage.setData(filtered);
        updatePrintMeta(filtered.length);
    }

    function updatePrintMeta(total) {
        var meta = document.getElementById('printMeta');
        if (!meta) return;
        var now = new Date();
        var lang = localStorage.getItem('userLanguage') || 'fa';
        var locale = lang === 'fa' ? 'fa-IR' : (lang === 'zh' ? 'zh-CN' : 'en-GB');
        var stamp = now.toLocaleDateString(locale) + ' - ' + now.toLocaleTimeString(locale);
        var count = total === undefined ? allCAs.length : total;
        meta.textContent = tr('records_count', 'تعداد رکوردها') + ': ' + count + ' | ' + tr('print_date', 'تاریخ چاپ') + ': ' + stamp;
    }

    function resetFilters() {
        ['searchInput', 'statusFilter', 'priorityFilter', 'dateFrom', 'dateTo', 'departmentFilter'].forEach(function (id) {
            var el = document.getElementById(id);
            if (el) el.value = '';
        });
        applyFilters();
        if (typeof window.showNotification === 'function') {
            window.showNotification(tr('reset', 'بازنشانی') + ' ✓', 'info');
        }
    }

    function exportData() {
        var stamp = new Date().toISOString().slice(0, 10);
        listPage.exportCSV('corrective-actions-' + stamp + '.csv');
    }

    function printPage() {
        updatePrintMeta();
        window.print();
    }

    function loadCorrectiveActions() {
        var raw = [];
        try {
            raw = JSON.parse(localStorage.getItem('corrective_actions') || '[]');
        } catch (e) {
            raw = [];
        }

        if (!Array.isArray(raw)) raw = [];
        allCAs = filterByRole(raw);

        populateDepartments();
        applyFilters();
    }

    document.addEventListener('DOMContentLoaded', function () {
        loadCorrectiveActions();
    });

    document.addEventListener('languagechange', function () {
        populateDepartments();
        applyFilters();
    });
    </script>
</body>
</html>

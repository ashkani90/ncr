<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت نقش‌ها</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .roles-container { background: white; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); padding: 25px; }
        .role-card { border: 2px solid #e9ecef; border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .role-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .role-name { font-size: 18px; font-weight: 700; color: #2c3e50; }
        .role-desc { color: #6c757d; font-size: 13px; }
        .permissions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 15px; }
        .permission-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #f8f9fa; border-radius: 8px; font-size: 13px; }
        .permission-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="headerContainer"></div>
        <div id="sidebarContainer"></div>
        
        <main class="main-content" id="mainContent">
            <div class="roles-container">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h3><i class="fas fa-shield-alt" style="color:#667eea;"></i> مدیریت نقش‌ها و دسترسی‌ها</h3>
                    <button class="btn btn-primary" onclick="saveAllRoles()">
                        <i class="fas fa-save"></i> ذخیره همه تغییرات
                    </button>
                </div>
                
                <div id="rolesList">در حال بارگذاری...</div>
            </div>
            
            <div id="footerContainer"></div>
        </main>
    </div>
    
    <script src="i18n.js?v=3"></script>
    <script src="i18n-literals.js?v=1"></script>
    <script src="database.js?v=20261101"></script>
    <script src="permissions.js?v=20261101"></script>
    <script src="app.js"></script>
    <script src="components/loader.js?v=20261101"></script>
    
    <script>
    let allRoles = [];
    let allPermissions = [];
    let roleChanges = {}; // {roleName: [permissionCodes]}
    
    document.addEventListener('DOMContentLoaded', async function() {
        await loadAllComponents();
        await loadRolesAndPermissions();
    });
    
    async function loadRolesAndPermissions() {
        try {
            // دریافت نقش‌ها
            const rolesRes = await fetch(window.NCR_API + '/get_roles.php');
            const rolesData = await rolesRes.json();
            
            // دریافت همه دسترسی‌ها
            const permsRes = await fetch(window.NCR_API + '/get_permissions.php');
            const permsData = await permsRes.json();
            
            if (rolesData.success) allRoles = rolesData.data;
            if (permsData.success) allPermissions = permsData.data;
            
            renderRoles();
        } catch (e) {
            console.error(e);
            document.getElementById('rolesList').innerHTML = '<p style="color:red;">خطا در بارگذاری</p>';
        }
    }
    
    function renderRoles() {
        const container = document.getElementById('rolesList');
        
        container.innerHTML = allRoles.map(role => {
            const perms = roleChanges[role.name] || role.permissions || [];
            
            return `
                <div class="role-card" data-role="${role.name}">
                    <div class="role-header">
                        <div>
                            <div class="role-name">${role.description || role.name}</div>
                            <div class="role-desc">نام داخلی: ${role.name}</div>
                        </div>
                        <span class="badge badge-info">${perms.length} دسترسی</span>
                    </div>
                    <div class="permissions-grid">
                        ${allPermissions.map(p => `
                            <label class="permission-item">
                                <input type="checkbox" 
                                       data-role="${role.name}" 
                                       data-permission="${p.code}"
                                       ${perms.includes(p.code) ? 'checked' : ''}
                                       onchange="onPermissionChange('${role.name}', '${p.code}', this.checked)">
                                <span>${p.name}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>
            `;
        }).join('');
    }
    
    function onPermissionChange(roleName, permissionCode, isChecked) {
        if (!roleChanges[roleName]) {
            // کپی از دسترسی‌های فعلی
            const role = allRoles.find(r => r.name === roleName);
            roleChanges[roleName] = [...(role.permissions || [])];
        }
        
        const perms = roleChanges[roleName];
        const index = perms.indexOf(permissionCode);
        
        if (isChecked && index === -1) {
            perms.push(permissionCode);
        } else if (!isChecked && index !== -1) {
            perms.splice(index, 1);
        }
    }
    
    async function saveAllRoles() {
        if (Object.keys(roleChanges).length === 0) {
            alert('هیچ تغییری برای ذخیره وجود ندارد');
            return;
        }
        
        let successCount = 0;
        let errorCount = 0;
        
        for (const [roleName, permissions] of Object.entries(roleChanges)) {
            try {
                const res = await fetch(window.NCR_API + '/get_roles.php', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ role_name: roleName, permissions })
                });
                const result = await res.json();
                
                if (result.success) successCount++;
                else errorCount++;
            } catch (e) {
                errorCount++;
            }
        }
        
        if (errorCount === 0) {
            alert(`✅ ${successCount} نقش با موفقیت بروزرسانی شد`);
            roleChanges = {};
            await loadRolesAndPermissions();
        } else {
            alert(`⚠️ ${successCount} موفق، ${errorCount} خطا`);
        }
    }
    </script>
</body>
</html>

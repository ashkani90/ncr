<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="menu_ncr_list">لیست NCRها</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="list-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .filter-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-secondary:hover { background: #5a6268; }
        .table-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-top: 1px solid #e9ecef;
            flex-wrap: wrap;
            gap: 10px;
        }
        .pagination { display: flex; gap: 10px; align-items: center; }
        .pagination button {
            padding: 5px 12px;
            border: 1px solid #e9ecef;
            border-radius: 5px;
            background: white;
            cursor: pointer;
        }
        .link-primary { color: #667eea; text-decoration: none; }
        .link-primary:hover { text-decoration: underline; }
        .loading-row { text-align: center; padding: 40px; color: #6c757d; }
        .loading-row i { font-size: 24px; animation: spin 1s linear infinite; margin-left: 8px; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        /* استایل دکمه‌های غیرفعال */
        .btn-disabled {
            opacity: 0.4 !important;
            cursor: not-allowed !important;
            pointer-events: none !important;
            background: #e9ecef !important;
            color: #adb5bd !important;
            border: 1px solid #dee2e6 !important;
        }
        .btn-disabled i {
            color: #adb5bd !important;
        }

        /* ⭐ استایل دکمه چاپ */
        .btn-print-ncr {
            background: #8e44ad;
            color: white;
            border: none;
        }
        .btn-print-ncr:hover {
            background: #7d3c98;
        }
        .btn-print-ncr i {
            color: white;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="headerContainer"></div>
        <div id="sidebarContainer"></div>

        <main class="main-content" id="mainContent">
            <!-- فیلترها -->
            <div class="filter-section">
                <div class="filter-grid">
                    <div class="form-group">
                        <label>جستجو</label>
                        <input type="text" id="searchInput" placeholder="جستجو در شماره، قطعه، موضوع..." oninput="filterNCRs()">
                    </div>
                    <div class="form-group">
                        <label>وضعیت</label>
                        <select id="statusFilter" onchange="filterNCRs()">
                            <option value="">همه وضعیت‌ها</option>
                            <option value="open">باز</option>
                            <option value="in_progress">در حال بررسی</option>
                            <option value="closed">بسته</option>
                            <option value="rejected">رد شده</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>اولویت</label>
                        <select id="priorityFilter" onchange="filterNCRs()">
                            <option value="">همه اولویت‌ها</option>
                            <option value="high">بالا</option>
                            <option value="medium">متوسط</option>
                            <option value="low">کم</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>تاریخ از</label>
                        <input type="date" id="dateFrom" onchange="filterNCRs()">
                    </div>
                    <div class="form-group">
                        <label>تاریخ تا</label>
                        <input type="date" id="dateTo" onchange="filterNCRs()">
                    </div>
                    <div class="form-group">
                        <label>دپارتمان</label>
                        <select id="departmentFilter" onchange="filterNCRs()">
                            <option value="">همه دپارتمان‌ها</option>
                            <option value="تولید">تولید</option>
                            <option value="کنترل کیفیت">کنترل کیفیت</option>
                            <option value="انبار">انبار</option>
                            <option value="مهندسی">مهندسی</option>
                            <option value="خرید">خرید</option>
                        </select>
                    </div>
                </div>
                <div class="filter-actions">
                    <button class="btn btn-secondary" onclick="resetFilters()"><i class="fas fa-undo"></i> بازنشانی</button>
                    <button class="btn btn-success" onclick="exportData()"><i class="fas fa-file-excel"></i> خروجی اکسل</button>
                    <button class="btn btn-warning" onclick="printPage()"><i class="fas fa-print"></i> چاپ</button>
                </div>
            </div>

            <!-- جدول NCRها -->
            <div class="table-container">
                <div class="table-header">
                    <h3>📋 لیست کامل NCRها</h3>
                    <span class="table-count" id="recordCount">تعداد: 0</span>
                </div>
                <div style="overflow-x: auto;">
                    <table id="ncrTable">
                        <thead>
                            <tr>
                                <th onclick="sortTable('ncr_number')" style="cursor:pointer;">شماره <i class="fas fa-sort"></i></th>
                                <th onclick="sortTable('part_name')" style="cursor:pointer;">قطعه <i class="fas fa-sort"></i></th>
                                <th onclick="sortTable('subject')" style="cursor:pointer;">موضوع <i class="fas fa-sort"></i></th>
                                <th onclick="sortTable('report_date')" style="cursor:pointer;">تاریخ <i class="fas fa-sort"></i></th>
                                <th onclick="sortTable('priority')" style="cursor:pointer;">اولویت <i class="fas fa-sort"></i></th>
                                <th>مرحله</th>
                                <th onclick="sortTable('final_status')" style="cursor:pointer;">وضعیت <i class="fas fa-sort"></i></th>
                                <th>گزارش‌دهنده</th>
                                <th>عملیات</th>
                            </tr>
                        </thead>
                        <tbody id="ncrTableBody">
                            <tr>
                                <td colspan="9" class="loading-row">
                                    <i class="fas fa-spinner"></i>
                                    در حال بارگذاری...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="table-footer">
                    <div class="pagination">
                        <button onclick="changePage('prev')"><i class="fas fa-chevron-right"></i></button>
                        <span id="pageInfo">صفحه 1 از 1</span>
                        <button onclick="changePage('next')"><i class="fas fa-chevron-left"></i></button>
                    </div>
                    <div class="page-size">
                        <label>تعداد در صفحه:</label>
                        <select id="pageSize" onchange="changePageSize()">
                            <option value="10">10</option>
                            <option value="25" selected>25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="footerContainer"></div>
        </main>
    </div>

    <script src="i18n.js?v=3"></script>
    <script src="i18n-literals.js?v=1"></script>
    <script src="database.js?v=20261101"></script>
    <script src="permissions.js?v=20261101"></script>
    <script src="app.js"></script>
    <script src="print.js"></script>
    <script src="list-tools.js"></script>
    <script src="components/loader.js?v=20261101"></script>

    <script>
    // ============================================
    // متغیرهای سراسری
    // ============================================
    let allNCRs = [];
    let filteredNCRs = [];
    let currentPage = 1;
    let pageSize = 25;
    let sortField = 'report_date';
    let sortDirection = 'desc';

    // ترجمه با کلید i18n
    function tl(key, fallback) {
        if (window.ListTools && window.ListTools.tr) return window.ListTools.tr(key, fallback);
        return fallback;
    }

    // ============================================
    // ⭐ راه‌اندازی اولیه
    // ============================================
    async function initNCRListPage() {
        console.log('🚀 initNCRListPage started');
        
        if (typeof window.loadAllComponents === 'function') {
            try {
                await window.loadAllComponents();
                console.log('✅ Components loaded');
            } catch (e) {
                console.warn('⚠️ loadAllComponents error:', e);
            }
        }
        
        console.log('📡 Now loading NCRs...');
        await loadNCRsFromDatabase();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initNCRListPage);
    } else {
        initNCRListPage();
    }

    // ============================================
    // ⭐ بارگذاری NCRها از API
    // ============================================
    async function loadNCRsFromDatabase() {
        const tbody = document.getElementById('ncrTableBody');
        if (!tbody) {
            console.error('❌ ncrTableBody not found');
            return;
        }
        
        tbody.innerHTML = '<tr><td colspan="9" class="loading-row"><i class="fas fa-spinner"></i> در حال بارگذاری داده‌ها...</td></tr>';
        
        try {
            console.log('📡 Fetching NCRs from API...');
            
            const url = window.NCR_API + '/get_ncrs.php';
            const response = await fetch(url);
            const text = await response.text();
            
            let result;
            try {
                result = JSON.parse(text);
            } catch (e) {
                console.error('❌ JSON parse error:', e);
                tbody.innerHTML = '<tr><td colspan="9" class="loading-row" style="color:red;">خطا: پاسخ سرور نامعتبر است</td></tr>';
                return;
            }
            
            if (result && result.success && result.data) {
                allNCRs = result.data;
                filteredNCRs = [...allNCRs];
                console.log('✅ Loaded ' + allNCRs.length + ' NCRs');
                
                if (allNCRs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" class="loading-row">' + tl('no_data', 'هیچ NCR ثبت نشده است') + '</td></tr>';
                    document.getElementById('recordCount').textContent = tl('count_label', 'تعداد') + ': 0';
                    return;
                }
                
                renderTable();
                document.getElementById('recordCount').textContent = tl('count_label', 'تعداد') + ': ' + allNCRs.length;
            } else {
                console.error('❌ API returned error:', result);
                tbody.innerHTML = '<tr><td colspan="9" class="loading-row" style="color:red;">خطا: ' + (result.error || 'پاسخ نامعتبر') + '</td></tr>';
            }
        } catch (error) {
            console.error('❌ Fetch error:', error);
            tbody.innerHTML = '<tr><td colspan="9" class="loading-row" style="color:red;">خطا در ارتباط با سرور: ' + error.message + '</td></tr>';
        }
    }

    // ============================================
    // فیلتر کردن NCRها
    // ============================================
    function filterNCRs() {
        const search = document.getElementById('searchInput').value.trim().toLowerCase();
        const status = document.getElementById('statusFilter').value;
        const priority = document.getElementById('priorityFilter').value;
        const dateFrom = document.getElementById('dateFrom').value;
        const dateTo = document.getElementById('dateTo').value;
        const department = document.getElementById('departmentFilter').value;

        filteredNCRs = allNCRs.filter(function(ncr) {
            const searchableFields = [
                ncr.ncr_number || '',
                ncr.part_name || '',
                ncr.subject || '',
                ncr.part_code || '',
                ncr.reporter_name || '',
                ncr.description || ''
            ];
            const matchSearch = !search || searchableFields.some(field => 
                field.toString().toLowerCase().includes(search)
            );

            let ncrStatus = ncr.final_status || ncr.status || 'open';
            if (ncrStatus === 'draft' || ncrStatus === 'step1_submitted') ncrStatus = 'open';
            else if (ncrStatus === 'step2_submitted' || ncrStatus === 'step3_submitted') ncrStatus = 'in_progress';
            const matchStatus = !status || ncrStatus === status;

            const ncrPriority = ncr.priority || 'medium';
            const matchPriority = !priority || ncrPriority === priority;

            const matchDate = (!dateFrom || (ncr.report_date && ncr.report_date >= dateFrom)) && 
                              (!dateTo || (ncr.report_date && ncr.report_date <= dateTo));

            const matchDepartment = !department || (ncr.reporter_department && ncr.reporter_department === department);

            return matchSearch && matchStatus && matchPriority && matchDate && matchDepartment;
        });

        currentPage = 1;
        renderTable();
        document.getElementById('recordCount').textContent = tl('count_label', 'تعداد') + ': ' + filteredNCRs.length;
    }

    // ============================================
    // بازنشانی فیلترها
    // ============================================
    function resetFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('statusFilter').value = '';
        document.getElementById('priorityFilter').value = '';
        document.getElementById('dateFrom').value = '';
        document.getElementById('dateTo').value = '';
        document.getElementById('departmentFilter').value = '';
        filterNCRs();
        showNotification('فیلترها بازنشانی شدند.', 'info');
    }

    // ============================================
    // ⭐⭐⭐ تعیین مرحله NCR از داده‌ها
    // ============================================
    function getNCRCurrentStep(ncr) {
        if (ncr.current_step) {
            return parseInt(ncr.current_step);
        }
        const status = ncr.status || 'draft';
        if (status === 'draft' || status === 'step1_submitted') return 1;
        if (status === 'step2_submitted') return 2;
        if (status === 'step3_submitted') return 3;
        if (status === 'closed') return 4;
        return 1;
    }

    // ============================================
    // ⭐⭐⭐ تعیین مرحله جاری بر اساس وضعیت
    // ============================================
    function getCurrentStage(ncr) {
        const status = ncr.status || 'draft';
        if (status === 'draft' || status === 'step1_submitted') return 1;
        if (status === 'step2_submitted') return 2;
        if (status === 'step3_submitted') return 3;
        if (status === 'closed') return 4;
        return 1;
    }

    // ============================================
    // ⭐⭐⭐ بررسی دسترسی‌ها
    // ============================================
    function getActionPermissions(ncr) {
        const currentStage = getCurrentStage(ncr);
        const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
        const userRole = user ? user.role : 'reporter';
        
        const currentUserName = user ? (user.full_name || user.username || '').trim() : '';
        const currentUserId = user ? parseInt(user.id || 0) : 0;
        const currentUserUsername = user ? (user.username || '').trim() : '';
        
        const reporterName = (ncr.reporter_name || '').trim();
        const reporterId = ncr.created_by_id ? parseInt(ncr.created_by_id) : 0;
        
        const isReporterByName = (currentUserName && reporterName && 
                                  currentUserName === reporterName);
        const isReporterByUsername = (currentUserUsername && reporterName && 
                                      currentUserUsername === reporterName);
        const isReporterById = (currentUserId && reporterId && 
                                currentUserId === reporterId);
        
        const isReporter = isReporterByName || isReporterByUsername || isReporterById;
        const isAdmin = (userRole === 'admin');
        
        // مشاهده
        let canView = true;
        const ncrStep = getNCRCurrentStep(ncr);
        if (ncrStep >= 2 && ncr.status === 'draft') {
            canView = false;
        }
        
        // ویرایش
        let canEdit = false;
        if (ncr.status === 'closed') {
            canEdit = false;
        } else {
            if (typeof window.canEditNCRStep === 'function') {
                let stepToEdit = 1;
                if (ncr.status === 'draft' || ncr.status === 'step1_submitted') stepToEdit = 1;
                else if (ncr.status === 'step2_submitted') stepToEdit = 2;
                else if (ncr.status === 'step3_submitted') stepToEdit = 3;
                
                const ncrDataForCheck = {
                    status: ncr.status,
                    step2_submitted_at: ncr.step2_submitted_at,
                    step3_submitted_at: ncr.step3_submitted_at,
                    step4_submitted_at: ncr.step4_submitted_at
                };
                canEdit = window.canEditNCRStep(stepToEdit, ncrDataForCheck);
            } else {
                if (ncr.status === 'draft' || ncr.status === 'step1_submitted') {
                    canEdit = true;
                } else if (ncr.status === 'step2_submitted') {
                    canEdit = (userRole === 'quality' || userRole === 'admin');
                } else if (ncr.status === 'step3_submitted') {
                    canEdit = (userRole === 'engineering' || userRole === 'admin');
                }
            }
        }
        
        // حذف
        let canDelete = false;
        if (ncr.status !== 'closed') {
            const step2Done = ncr.step2_submitted_at != null;
            const step3Done = ncr.step3_submitted_at != null;
            const step4Done = ncr.step4_submitted_at != null;
            const stagesNotDone = (!step2Done && !step3Done && !step4Done);
            
            if (stagesNotDone && (isReporter || isAdmin)) {
                canDelete = true;
            }
        }
        
        // ⭐ چاپ: همه می‌توانند چاپ کنند
        const canPrint = true;
        
        return { 
            canView, 
            canEdit, 
            canDelete, 
            canPrint,
            currentStage, 
            ncrStep,
            isReporter,
            isAdmin
        };
    }

    // ============================================
    // ⭐⭐⭐ رندر جدول با دکمه‌های شرطی + دکمه چاپ
    // ============================================
    function renderTable() {
        const tbody = document.getElementById('ncrTableBody');
        
        if (!filteredNCRs || filteredNCRs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="loading-row">هیچ NCR یافت نشد</td></tr>';
            return;
        }

        const sorted = [...filteredNCRs].sort(function(a, b) {
            let aVal = a[sortField] || '';
            let bVal = b[sortField] || '';
            if (sortField === 'report_date' || sortField === 'created_at') {
                aVal = new Date(aVal);
                bVal = new Date(bVal);
            }
            if (typeof aVal === 'string') aVal = aVal.toLowerCase();
            if (typeof bVal === 'string') bVal = bVal.toLowerCase();
            if (aVal < bVal) return sortDirection === 'asc' ? -1 : 1;
            if (aVal > bVal) return sortDirection === 'asc' ? 1 : -1;
            return 0;
        });

        const totalPages = Math.ceil(sorted.length / pageSize) || 1;
        const start = (currentPage - 1) * pageSize;
        const end = Math.min(start + pageSize, sorted.length);
        const pageData = sorted.slice(start, end);

        document.getElementById('pageInfo').textContent = tl('page_info', 'صفحه') + ' ' + currentPage + ' / ' + totalPages;

        const priorityLabels = {
            high: '<span class="badge badge-danger">' + tl('priority_high', 'بالا') + '</span>',
            medium: '<span class="badge badge-warning">' + tl('priority_medium', 'متوسط') + '</span>',
            low: '<span class="badge badge-info">' + tl('priority_low', 'کم') + '</span>'
        };
        
        const statusLabels = {
            closed: '<span class="badge badge-success">' + tl('status_closed', 'بسته') + '</span>',
            in_progress: '<span class="badge badge-warning">' + tl('status_in_progress', 'در حال بررسی') + '</span>',
            open: '<span class="badge badge-danger">' + tl('status_open', 'باز') + '</span>',
            rejected: '<span class="badge badge-secondary">' + tl('status_rejected', 'رد شده') + '</span>'
        };

        let html = '';
        pageData.forEach(function(ncr) {
            const ncrNumber = ncr.ncr_number || '-';
            const partName = ncr.part_name || '-';
            const subject = ncr.subject || ncr.description || '-';
            const reportDate = ncr.report_date || '-';
            
            const priorityKey = ncr.priority || 'medium';
            const priorityHtml = priorityLabels[priorityKey] || priorityLabels.medium;
            
            let statusKey = ncr.final_status || ncr.status || 'open';
            if (statusKey === 'draft' || statusKey === 'step1_submitted') statusKey = 'open';
            else if (statusKey === 'step2_submitted' || statusKey === 'step3_submitted') statusKey = 'in_progress';
            const statusHtml = statusLabels[statusKey] || statusLabels.open;
            
            const stepHtml = getStepBadge(ncr);
            const reporter = ncr.reporter_name || '-';
            
            const permissions = getActionPermissions(ncr);
            
            // دکمه مشاهده
            let viewBtn = '';
            if (permissions.canView) {
                viewBtn = '<button class="btn btn-sm btn-primary" onclick="viewNCR(\'' + ncrNumber + '\')" title="مشاهده"><i class="fas fa-eye"></i></button>';
            } else {
                viewBtn = '<button class="btn btn-sm btn-primary btn-disabled" title="مشاهده غیرفعال"><i class="fas fa-eye"></i></button>';
            }
            
            // دکمه ویرایش
            let editBtn = '';
            if (permissions.canEdit) {
                editBtn = '<button class="btn btn-sm btn-success" onclick="editNCR(\'' + ncrNumber + '\')" title="ویرایش"><i class="fas fa-edit"></i></button>';
            } else {
                editBtn = '<button class="btn btn-sm btn-success btn-disabled" title="ویرایش غیرفعال"><i class="fas fa-edit"></i></button>';
            }
            
            // دکمه حذف
            let deleteBtn = '';
            if (permissions.canDelete) {
                deleteBtn = '<button class="btn btn-sm btn-danger" onclick="deleteNCR(\'' + ncrNumber + '\')" title="حذف"><i class="fas fa-trash"></i></button>';
            } else {
                deleteBtn = '<button class="btn btn-sm btn-danger btn-disabled" title="حذف غیرفعال"><i class="fas fa-trash"></i></button>';
            }
            
            // ⭐⭐⭐ دکمه چاپ (همیشه فعال)
            let printBtn = '';
            if (permissions.canPrint) {
                printBtn = '<button class="btn btn-sm btn-print-ncr" onclick="printNCRFromList(\'' + ncrNumber + '\')" title="چاپ فرم NCR"><i class="fas fa-print"></i></button>';
            }
            
            html += '<tr>' +
                '<td><strong><a href="new-ncr.html?number=' + ncrNumber + '" class="link-primary">' + ncrNumber + '</a></strong></td>' +
                '<td>' + partName + '</td>' +
                '<td>' + subject + '</td>' +
                '<td>' + reportDate + '</td>' +
                '<td>' + priorityHtml + '</td>' +
                '<td>' + stepHtml + '</td>' +
                '<td>' + statusHtml + '</td>' +
                '<td>' + reporter + '</td>' +
                '<td style="white-space:nowrap;">' +
                    viewBtn + ' ' +
                    editBtn + ' ' +
                    printBtn + ' ' +
                    deleteBtn +
                '</td>' +
            '</tr>';
        });

        tbody.innerHTML = html;
    }

    // ============================================
    // مرحله NCR - نمایش بج مرحله
    // ============================================
    function getStepBadge(ncr) {
        const status = ncr.status || 'draft';
        
        if (status === 'closed' || ncr.final_status === 'closed') {
            return '<span class="badge badge-success">مرحله 4: پایش</span>';
        } else if (status === 'step3_submitted') {
            return '<span class="badge badge-info">مرحله 4: پایش</span>';
        } else if (status === 'step2_submitted') {
            return '<span class="badge badge-info">مرحله 3: تعیین تکلیف</span>';
        } else if (status === 'step1_submitted') {
            return '<span class="badge badge-info">مرحله 2: ارزیابی و تحلیل</span>';
        } else if (status === 'draft') {
            return '<span class="badge badge-secondary">مرحله 1: شناسایی</span>';
        } else {
            return '<span class="badge badge-secondary">مرحله 1: شناسایی</span>';
        }
    }

    // ============================================
    // مرتب‌سازی و صفحه‌بندی
    // ============================================
    function sortTable(field) {
        if (sortField === field) {
            sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
        } else {
            sortField = field;
            sortDirection = 'asc';
        }
        renderTable();
    }

    function changePage(direction) {
        var totalPages = Math.ceil(filteredNCRs.length / pageSize) || 1;
        if (direction === 'prev' && currentPage > 1) currentPage--;
        if (direction === 'next' && currentPage < totalPages) currentPage++;
        renderTable();
    }

    function changePageSize() {
        pageSize = parseInt(document.getElementById('pageSize').value);
        currentPage = 1;
        renderTable();
    }

    // ============================================
    // عملیات
    // ============================================
    function viewNCR(number) {
        if (number && number !== '-') {
            window.location.href = 'new-ncr.html?number=' + number;
        }
    }

    function editNCR(number) {
        if (number && number !== '-') {
            window.location.href = 'new-ncr.html?number=' + number + '&edit=true';
        }
    }

    async function deleteNCR(number) {
        if (!number || number === '-') return;
        
        const ncr = allNCRs.find(n => n.ncr_number === number);
        if (!ncr) {
            showNotification('NCR یافت نشد!', 'error');
            return;
        }
        
        const permissions = getActionPermissions(ncr);
        if (!permissions.canDelete) {
            showNotification('شما مجاز به حذف این NCR نیستید!', 'error');
            return;
        }
        
        if (!confirm('آیا از حذف NCR ' + number + ' مطمئن هستید؟')) return;

        try {
            const response = await fetch(window.NCR_API + '/delete_ncr.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ncr_number: number })
            });
            const result = await response.json();
            
            if (result.success) {
                showNotification('NCR با موفقیت حذف شد!', 'success');
                await loadNCRsFromDatabase();
            } else {
                showNotification('خطا: ' + (result.error || ''), 'error');
            }
        } catch (error) {
            console.error('❌ Delete error:', error);
            showNotification('خطا در حذف NCR', 'error');
        }
    }

    // ============================================
    // ⭐⭐⭐ چاپ فرم NCR از لیست
    // ============================================
    async function printNCRFromList(ncrNumber) {
        console.log('🖨️ printNCRFromList called for:', ncrNumber);
        
        if (!ncrNumber || ncrNumber === '-') {
            showNotification('شماره NCR نامعتبر است', 'error');
            return;
        }
        
        showNotification('در حال آماده‌سازی فرم چاپی...', 'info');
        
        try {
            // بارگذاری داده‌های کامل NCR از API
            const url = window.NCR_API + '/get_ncr.php?number=' + encodeURIComponent(ncrNumber);
            const response = await fetch(url);
            const text = await response.text();
            
            let result;
            try {
                result = JSON.parse(text);
            } catch (e) {
                console.error('❌ JSON parse error:', e);
                showNotification('خطا: پاسخ سرور نامعتبر است', 'error');
                return;
            }
            
            if (!result.success || !result.data) {
                showNotification('خطا در بارگذاری NCR: ' + (result.error || 'داده یافت نشد'), 'error');
                return;
            }
            
            const ncr = result.data;
            
            // ساخت آبجکت داده برای چاپ
            const ncrDataForPrint = buildNCRDataForPrint(ncr);
            
            // باز کردن پنجره چاپ
            openPrintWindow(ncrDataForPrint);
            
        } catch (error) {
            console.error('❌ printNCRFromList error:', error);
            showNotification('خطا در آماده‌سازی چاپ: ' + error.message, 'error');
        }
    }

    // ============================================
    // ⭐ ساخت آبجکت داده برای چاپ
    // ============================================

        // پارس کردن فیلدهای JSON
        let fishboneChecked = [];
        let fishboneSubItems = {};
        let partImage = null;
        
        try {
            if (ncr.fishbone_checks) {
                fishboneChecked = typeof ncr.fishbone_checks === 'string' 
                    ? JSON.parse(ncr.fishbone_checks) 
                    : ncr.fishbone_checks;
            }
        } catch (e) { console.warn('fishbone_checks parse error:', e); }
        
        try {
            if (ncr.fishbone_other) {
                fishboneSubItems = typeof ncr.fishbone_other === 'string' 
                    ? JSON.parse(ncr.fishbone_other) 
                    : ncr.fishbone_other;
            }
        } catch (e) { console.warn('fishbone_other parse error:', e); }
        
        try {
            if (ncr.part_image) {
                partImage = typeof ncr.part_image === 'string' 
                    ? JSON.parse(ncr.part_image) 
                    : ncr.part_image;
            }
        } catch (e) { 
            partImage = ncr.part_image; 
        }
        
        return {
            step1_data: {
                ncr_number: ncr.ncr_number || '-',
                report_date: ncr.report_date || '',
                reporter_name: ncr.reporter_name || '-',

                product_type: ncr.product_type || '-',

                car_model: ncr.car_model || '',
                truck_model: ncr.truck_model || '',
                minibus_model: ncr.minibus_model || '',
                tractor_model: ncr.tractor_model || '',
                part_code: ncr.part_code || '-',
                part_name: ncr.part_name || '-',
                quantity: ncr.quantity || '-',
                unit: ncr.unit || '-',
                description: ncr.description || '-',
                batch_number: ncr.batch_number || ''

            step2_data: {

    // ============================================
    // ⭐ توابع کمکی چاپ (کپی شده از new-ncr.html)
    // ============================================
    function formatPersianDate(dateStr) {
        if (!dateStr) return '-';
        var parts = dateStr.split('-');
        if (parts.length !== 3) return dateStr;
        var months = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
        var m = parseInt(parts[1]) - 1;
        return parseInt(parts[2]) + ' ' + months[m] + ' ' + parts[0];
    }

    function getProductModel(d1) {
        if (!d1.product_type) return '-';
        if (d1.product_type === 'اتوبوس') return d1.bus_model || '-';
        if (d1.product_type === 'سواری') return d1.car_model || '-';
        if (d1.product_type === 'کامیونت') return d1.truck_model || '-';
        if (d1.product_type === 'مینی بوس') return d1.minibus_model || '-';
        if (d1.product_type === 'کشنده') return d1.tractor_model || '-';
        return '-';
    }

    // ============================================
    // ⭐ توابع کمکی SVG Fishbone
    // ============================================
    function buildFishboneSvgForPrint(problemText, checkedCategories, subItems) {
        checkedCategories = checkedCategories || [];
        subItems = subItems || {};

        var svgWidth = 900;
        var svgHeight = 420;
        var spineY = 210;
        var spineStartX = 60;
        var spineEndX = 680;

        var branchConfigs = [
            { id: 'material', defaultLabel: 'MATERIAL', isTop: true, startX: 160, startY: 60, spineX: 260 },
            { id: 'method', defaultLabel: 'METHOD', isTop: true, startX: 360, startY: 60, spineX: 460 },
            { id: 'measurement', defaultLabel: 'MEASUREMENT', isTop: true, startX: 560, startY: 60, spineX: 660 },
            { id: 'environment', defaultLabel: 'ENVIRONMENT', isTop: false, startX: 160, startY: 360, spineX: 260 },
            { id: 'machine', defaultLabel: 'MACHINE', isTop: false, startX: 360, startY: 360, spineX: 460 },
            { id: 'man', defaultLabel: 'MAN', isTop: false, startX: 560, startY: 360, spineX: 660 }
        ];

        var svgContent = '';
        svgContent += '<defs><filter id="cardShadowPrint" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.1" /></filter></defs>';

        // دم ماهی
        svgContent += '<path d="M 20 ' + (spineY - 40) + ' C 40 ' + (spineY - 20) + ', 40 ' + (spineY + 20) + ', 20 ' + (spineY + 40) + ' C 55 ' + (spineY + 20) + ', 55 ' + (spineY - 20) + ', 20 ' + (spineY - 40) + ' Z" fill="#64748b" opacity="0.3" />';
        svgContent += '<circle cx="' + spineStartX + '" cy="' + spineY + '" r="4" fill="#1e293b" />';

        // خط اصلی
        svgContent += '<line x1="' + spineStartX + '" y1="' + spineY + '" x2="' + spineEndX + '" y2="' + spineY + '" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />';

        // شاخه‌ها
        branchConfigs.forEach(function(cfg) {
            var isChecked = checkedCategories.indexOf(cfg.id) !== -1;
            var subs = subItems[cfg.id] || [];
            var isActive = isChecked || subs.length > 0;

            var boneColor = isActive ? '#dc2626' : '#94a3b8';
            var textColor = isActive ? '#b91c1c' : '#475569';
            var strokeWidth = isActive ? '2.5' : '1.5';

            var startX = cfg.startX;
            var startY = cfg.startY;
            var endX = cfg.spineX;
            var endY = spineY;

            svgContent += '<line x1="' + startX + '" y1="' + startY + '" x2="' + endX + '" y2="' + endY + '" stroke="' + boneColor + '" stroke-width="' + strokeWidth + '" stroke-linecap="round" />';
            svgContent += '<circle cx="' + endX + '" cy="' + endY + '" r="' + (isActive ? '4.5' : '3') + '" fill="' + boneColor + '" stroke="#fff" stroke-width="1" />';

            var badgeWidth = 90;
            var badgeHeight = 22;
            var badgeX = startX - (badgeWidth / 2);
            var badgeY = cfg.isTop ? startY - badgeHeight - 4 : startY + 4;
            var badgeBg = isActive ? '#ef4444' : '#f1f5f9';
            var badgeTextFill = isActive ? '#ffffff' : '#334155';
            var badgeBorder = isActive ? '#dc2626' : '#cbd5e1';

            svgContent += '<g filter="' + (isActive ? 'url(#cardShadowPrint)' : 'none') + '">';
            svgContent += '<rect x="' + badgeX + '" y="' + badgeY + '" width="' + badgeWidth + '" height="' + badgeHeight + '" rx="4" fill="' + badgeBg + '" stroke="' + badgeBorder + '" stroke-width="1" />';
            svgContent += '<text x="' + (badgeX + badgeWidth/2) + '" y="' + (badgeY + 15) + '" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="9" fill="' + badgeTextFill + '">' + cfg.defaultLabel + '</text>';
            svgContent += '</g>';

            if (subs.length > 0) {
                var totalSubs = subs.length;
                subs.forEach(function(subText, idx) {
                    var t = 0.25 + (idx + 1) * (0.55 / (totalSubs + 1));
                    var jointX = startX + t * (endX - startX);
                    var jointY = startY + t * (endY - startY);
                    var ribLength = 45;
                    var ribEndX = jointX - ribLength;
                    var ribEndY = jointY;

                    svgContent += '<line x1="' + jointX + '" y1="' + jointY + '" x2="' + ribEndX + '" y2="' + ribEndY + '" stroke="' + boneColor + '" stroke-width="1.5" stroke-linecap="round" />';
                    svgContent += '<circle cx="' + jointX + '" cy="' + jointY + '" r="2.5" fill="' + boneColor + '" />';

                    var circleX = ribEndX - 8;
                    var circleRadius = 7;
                    svgContent += '<circle cx="' + circleX + '" cy="' + ribEndY + '" r="' + circleRadius + '" fill="' + (isActive ? '#fee2e2' : '#f1f5f9') + '" stroke="' + boneColor + '" stroke-width="1" />';
                    svgContent += '<text x="' + circleX + '" y="' + (ribEndY + 2.5) + '" text-anchor="middle" font-size="8" font-weight="700" fill="' + textColor + '" font-family="Arial, sans-serif">' + (idx + 1) + '</text>';

                    var textEndX = circleX - circleRadius - 4;
                    var maxChars = 35;
                    var line1 = subText;
                    var line2 = '';
                    if (subText.length > maxChars) {
                        var splitIdx = subText.lastIndexOf(' ', maxChars);
                        if (splitIdx === -1 || splitIdx < maxChars * 0.5) splitIdx = maxChars;
                        line1 = subText.substring(0, splitIdx).trim();
                        line2 = subText.substring(splitIdx).trim();
                        if (line2.length > maxChars) line2 = line2.substring(0, maxChars - 3) + '...';
                    }

                    var line1Y, line2Y;
                    if (line2) {
                        line1Y = ribEndY - 3;
                        line2Y = ribEndY + 8;
                    } else {
                        line1Y = ribEndY + 3;
                        line2Y = null;
                    }

                    svgContent += '<text x="' + textEndX + '" y="' + line1Y + '" text-anchor="end" font-size="9" font-weight="600" fill="#1e293b" font-family="inherit, Vazirmatn, sans-serif">' + line1 + '</text>';
                    if (line2) {
                        svgContent += '<text x="' + textEndX + '" y="' + line2Y + '" text-anchor="end" font-size="9" font-weight="600" fill="#1e293b" font-family="inherit, Vazirmatn, sans-serif">' + line2 + '</text>';
                    }
                });
            }
        });

        // سر ماهی
        var headLength = 60;
        var headHeight = 45;
        var headTipX = spineEndX + headLength;
        var headBaseX = spineEndX;
        var headTopY = spineY - headHeight;
        var headBottomY = spineY + headHeight;

        svgContent += '<g filter="url(#cardShadowPrint)">';
        svgContent += '<defs><linearGradient id="fishHeadGradPrint" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" /></linearGradient></defs>';
        svgContent += '<polygon points="' + headBaseX + ',' + headTopY + ' ' + headTipX + ',' + spineY + ' ' + headBaseX + ',' + headBottomY + '" fill="url(#fishHeadGradPrint)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round" />';
        svgContent += '<circle cx="' + (headBaseX + 15) + '" cy="' + (spineY - 10) + '" r="3.5" fill="#ffffff" opacity="0.9" />';
        svgContent += '<circle cx="' + (headBaseX + 15) + '" cy="' + (spineY - 10) + '" r="1.8" fill="#0f172a" />';
        svgContent += '<path d="M ' + (headBaseX + 28) + ' ' + (spineY - 14) + ' Q ' + (headBaseX + 34) + ' ' + spineY + ' ' + (headBaseX + 28) + ' ' + (spineY + 14) + '" stroke="#64748b" stroke-width="1.5" fill="none" opacity="0.5" />';
        svgContent += '</g>';

        // جعبه معلول
        var boxX = headTipX + 15;
        var boxY = spineY - 45;
        var boxW = 200;
        var boxH = 90;

        var displayProblem = problemText || 'عدم انطباق';
        var problemLine1 = displayProblem;
        var problemLine2 = '';
        if (displayProblem.length > 25) {
            var splitIdx = displayProblem.lastIndexOf(' ', 25);
            if (splitIdx === -1) splitIdx = 25;
            problemLine1 = displayProblem.substring(0, splitIdx).trim();
            problemLine2 = displayProblem.substring(splitIdx).trim();
            if (problemLine2.length > 28) problemLine2 = problemLine2.substring(0, 25) + '...';
        }

        svgContent += '<g filter="url(#cardShadowPrint)">';
        svgContent += '<rect x="' + boxX + '" y="' + boxY + '" width="' + boxW + '" height="' + boxH + '" rx="8" fill="#ef4444" stroke="#dc2626" stroke-width="1.5" />';
        svgContent += '<text x="' + (boxX + boxW/2) + '" y="' + (boxY + 22) + '" text-anchor="middle" font-family="inherit, Vazirmatn, Arial, sans-serif" font-weight="800" font-size="10" fill="#ffffff">🚨 معلول / شرح مشکل</text>';
        svgContent += '<line x1="' + (boxX + 12) + '" y1="' + (boxY + 30) + '" x2="' + (boxX + boxW - 12) + '" y2="' + (boxY + 30) + '" stroke="#fca5a5" stroke-width="1" />';
        svgContent += '<text x="' + (boxX + boxW/2) + '" y="' + (boxY + 50) + '" text-anchor="middle" font-family="inherit, Vazirmatn, Tahoma, sans-serif" font-weight="700" font-size="9.5" fill="#ffffff">' + problemLine1 + '</text>';
        if (problemLine2) {
            svgContent += '<text x="' + (boxX + boxW/2) + '" y="' + (boxY + 68) + '" text-anchor="middle" font-family="inherit, Vazirmatn, Tahoma, sans-serif" font-weight="700" font-size="9.5" fill="#ffffff">' + problemLine2 + '</text>';
        }
        svgContent += '</g>';

        return '<svg viewBox="0 0 ' + svgWidth + ' ' + svgHeight + '" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;max-height:350px;">' + svgContent + '</svg>';
    }

    function buildFishboneListHtml(checkedCategories, subItems) {
        checkedCategories = checkedCategories || [];
        subItems = subItems || {};

        var catNames = { 'man': 'MAN', 'machine': 'MACHINE', 'method': 'METHOD', 'material': 'MATERIAL', 'environment': 'ENVIRONMENT', 'measurement': 'MEASUREMENT' };
        var catNamesFa = { 'man': 'نیروی انسانی', 'machine': 'ماشین', 'method': 'روش', 'material': 'مواد', 'environment': 'محیط', 'measurement': 'اندازه‌گیری' };

        var html = '<div class="fishbone-list"><div class="fishbone-list-title">🐟 دسته‌بندی‌های Fishbone:</div><div class="fishbone-categories">';
        var hasAny = false;

        ['man', 'machine', 'method', 'material', 'environment', 'measurement'].forEach(function(catId) {
            var isChecked = checkedCategories.indexOf(catId) !== -1;
            var subs = subItems[catId] || [];
            if (isChecked || subs.length > 0) {
                hasAny = true;
                html += '<div class="fishbone-cat">';
                html += '<div class="fishbone-cat-header"><span class="fishbone-cat-name">✓ ' + (catNamesFa[catId] || catId) + ' (' + (catNames[catId] || catId) + ')</span></div>';
                if (subs.length > 0) {
                    html += '<ul class="fishbone-subs">';
                    subs.forEach(function(s) { html += '<li>' + s + '</li>'; });
                    html += '</ul>';
                }
                html += '</div>';
            }
        });

        html += '</div></div>';
        return hasAny ? html : '';
    }

    function build5WhyHtml(d2) {
        var whyItems = [
            { num: 1, value: d2.why1 }, { num: 2, value: d2.why2 },
            { num: 3, value: d2.why3 }, { num: 4, value: d2.why4 }, { num: 5, value: d2.why5 }
        ];

        var html = '<div class="why-list"><div class="why-list-title">❓ تحلیل 5 چرا (5 Why):</div><ol class="why-items">';
        whyItems.forEach(function(w) {
            if (w.value && w.value.trim()) {
                html += '<li><strong>چرا ' + w.num + (w.num === 5 ? ' (ریشه‌ای)' : '') + ':</strong> ' + w.value + '</li>';
            } else {
                html += '<li><strong>چرا ' + w.num + (w.num === 5 ? ' (ریشه‌ای)' : '') + ':</strong> -</li>';
            }
        });
        html += '</ol></div>';
        return html;
    }

    function showNotification(message, type) {
        var colors = {
            success: '#27ae60',
            error: '#e74c3c',
            warning: '#f39c12',
            info: '#3498db'
        };
        
        document.querySelectorAll('.custom-notification').forEach(el => el.remove());
        
        var notification = document.createElement('div');
        notification.className = 'custom-notification';
        notification.style.cssText = 'position: fixed; top: 80px; right: 20px; padding: 15px 25px; background: ' + (colors[type] || '#3498db') + '; color: white; border-radius: 10px; font-weight: bold; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.2); max-width: 400px;';
        notification.textContent = message;
        document.body.appendChild(notification);

        setTimeout(function() {
            notification.style.opacity = '0';
            notification.style.transition = 'opacity 0.5s';
            setTimeout(function() { notification.remove(); }, 500);
        }, 3000);
    }

    function exportData() {
        var rows = (filteredNCRs && filteredNCRs.length) ? filteredNCRs : allNCRs;
        if (!rows.length) {
            showNotification('داده‌ای برای خروجی وجود ندارد.', 'warning');
            return;
        }

        var headers = ['شماره', 'قطعه', 'موضوع', 'تاریخ', 'اولویت', 'مرحله', 'وضعیت', 'گزارش‌دهنده'];
        var body = rows.map(function (ncr) {
            return [
                ncr.ncr_number || '',
                ncr.part_name || '',
                ncr.subject || '',
                ncr.report_date || '',
                ncr.priority || '',
                getNCRCurrentStep(ncr),
                ncr.final_status || ncr.status || '',
                ncr.reporter_name || ''
            ];
        });

        var stamp = new Date().toISOString().slice(0, 10);
        window.ListTools.downloadCSV('ncr-list-' + stamp + '.csv', headers, body);
    }

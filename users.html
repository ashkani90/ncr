<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت کاربران</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .users-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            padding: 25px;
        }
        .users-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .users-header h3 {
            margin: 0;
            color: #2c3e50;
        }
        .user-table {
            width: 100%;
            border-collapse: collapse;
        }
        .user-table th {
            background: #f8f9fa;
            padding: 12px 15px;
            font-weight: 600;
            border-bottom: 2px solid #e9ecef;
            text-align: right;
        }
        .user-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #f5f5f5;
        }
        .user-table tr:hover {
            background: #fafafa;
        }
        .role-badge {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .role-badge.admin { background: #d4edda; color: #155724; }
        .role-badge.quality { background: #d1ecf1; color: #0c5460; }
        .role-badge.production { background: #fff3cd; color: #856404; }
        .role-badge.purchasing { background: #e8daef; color: #6c3483; }
        .role-badge.warehouse { background: #fdebd0; color: #935e38; }
        .role-badge.engineering { background: #d5f5e3; color: #1a6e4a; }
        .role-badge.ceo { background: #fadbd8; color: #922b21; }
        .role-badge.user { background: #e9ecef; color: #495057; }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-box h3 {
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-actions .btn {
            flex: 1;
            justify-content: center;
        }
        @media (max-width: 768px) {
            .user-table { font-size: 13px; }
            .user-table th, .user-table td { padding: 8px 10px; }
            .users-header { flex-direction: column; align-items: stretch; }
        }
        /* تصویر کاربر در جدول */
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e9ecef;
            background: #f1f3f9;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #adb5bd;
            font-size: 14px;
        }
        .avatar-cell {
            width: 56px;
            text-align: center;
        }
        .user-table td {
            vertical-align: middle;
        }
        .avatar-uploader {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .avatar-preview {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: #f1f3f9;
            border: 2px dashed #d7dbe3;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #adb5bd;
            font-size: 26px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .avatar-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="headerContainer"></div>
        <div id="sidebarContainer"></div>

        <main class="main-content" id="mainContent">
            <div class="users-container">
                <div class="users-header">
                    <h3><i class="fas fa-users" style="color:#667eea;"></i> لیست کاربران</h3>
                    <!-- ⭐ اضافه کردن type="button" برای جلوگیری از submit -->
<a href="add-user.html" class="btn btn-primary">
    <i class="fas fa-user-plus"></i> افزودن کاربر جدید
</a>
                </div>

                <div class="table-responsive">
                    <table class="user-table" id="userTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th data-i18n="user_photo">تصویر</th>
                                <th>نام کاربری</th>
                                <th>نام کامل</th>
                                <th>ایمیل</th>
                                <th>نقش</th>
                                <th>دپارتمان</th>
                                <th>تاریخ ثبت</th>
                                <th>عملیات</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            <tr>
                                <td colspan="9" style="text-align:center;">در حال بارگذاری...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div id="footerContainer"></div>
        </main>
    </div>

    <!-- مودال افزودن/ویرایش کاربر -->
    <div class="modal-overlay" id="userModal">
        <div class="modal-box">
            <h3 id="modalTitle">افزودن کاربر جدید</h3>
            <form id="userForm" onsubmit="window.saveUser && window.saveUser(event)">
                <input type="hidden" id="editUserId" value="0">

                <div class="form-group">
                    <label data-i18n="user_photo">تصویر کاربر</label>
                    <div class="avatar-uploader">
                        <div class="avatar-preview" id="modalAvatarPreview">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="avatar-actions">
                            <label for="modalAvatarFile" class="btn-sm-outline" style="cursor:pointer;">
                                <i class="fas fa-camera"></i> <span data-i18n="upload_photo">انتخاب تصویر</span>
                            </label>
                            <input type="file" id="modalAvatarFile" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
                            <button type="button" id="modalRemoveAvatarBtn" class="btn-sm-outline" onclick="removeModalAvatar()" style="display:none;">
                                <i class="fas fa-trash"></i> <span data-i18n="remove_photo">حذف تصویر</span>
                            </button>
                            <small class="hint" data-i18n="avatar_help">فرمت JPG/PNG - حداکثر ۲ مگابایت</small>
                        </div>
                    </div>
                    <input type="hidden" id="modalAvatarPath" value="">
                </div>
                <div class="form-group">
                    <label>نام کاربری <span class="required">*</span></label>
                    <input type="text" id="username" placeholder="نام کاربری" required autocomplete="off">
                </div>
                <div class="form-group" id="passwordGroup">
                    <label>رمز عبور <span class="required" id="passwordRequired">*</span></label>
                    <input type="password" id="password" placeholder="رمز عبور" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>نام کامل <span class="required">*</span></label>
                    <input type="text" id="fullName" placeholder="نام و نام خانوادگی" required>
                </div>
                <div class="form-group">
                    <label>ایمیل</label>
                    <input type="email" id="email" placeholder="example@domain.com" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>نقش <span class="required">*</span></label>
                    <select id="role" required>
                        <option value="">در حال بارگذاری...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>دپارتمان</label>
                    <select id="department">
                        <option value="">انتخاب کنید</option>
                        <option value="مدیریت">مدیریت</option>
                        <option value="کنترل کیفیت">کنترل کیفیت</option>
                        <option value="تولید">تولید</option>
                        <option value="انبار">انبار</option>
                        <option value="مهندسی">مهندسی</option>
                        <option value="خرید">خرید</option>
                        <option value="خدمات پس از فروش">خدمات پس از فروش</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>زبان</label>
                    <select id="language">
                        <option value="fa">فارسی</option>
                        <option value="en">English</option>
                        <option value="zh">中文</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> ذخیره</button>
                    <button type="button" class="btn btn-secondary" onclick="window.closeUserModal && window.closeUserModal()"><i class="fas fa-times"></i> انصراف</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ⭐ ترتیب مهم: i18n, database, app, loader -->
    <script src="i18n.js?v=3"></script>
    <script src="i18n-literals.js?v=1"></script>
    <script src="database.js?v=20261101"></script>
    <script src="app.js"></script>
    <script src="components/loader.js?v=20261101"></script>
    
    <script>
    // ⭐⭐⭐ تعریف توابع در ابتدای اسکریپت برای دسترسی سریع
    // این توابع باید قبل از هر چیز تعریف شوند تا onclick کار کند
    
    // متغیرهای سراسری
    window.users = [];

// آدرس کامل تصویر کاربر
function avatarUrl(path) {
    if (!path) return '';
    if (/^(https?:|data:|\/)/.test(path)) return path;
    return (window.NCR_ROOT || '') + path;
}
window.avatarUrl = avatarUrl;
    window.availableRoles = [];
    
    // ⭐ تابع امن برای setTextContent
    function safeSetText(id, text) {
        const el = document.getElementById(id);
        if (el) el.textContent = text;
    }
    
    // ⭐⭐⭐ تابع باز کردن مودال - تعریف در سطح window
    window.openAddUserModal = function() {
        console.log('🔓 openAddUserModal called');
        
        const modal = document.getElementById('userModal');
        if (!modal) {
            console.error('❌ userModal not found');
            return;
        }
        
        document.getElementById('modalTitle').textContent = 'افزودن کاربر جدید';
        document.getElementById('editUserId').value = '0';
        document.getElementById('username').value = '';
        document.getElementById('username').disabled = false;
        document.getElementById('password').value = '';
        document.getElementById('password').required = true;
        document.getElementById('passwordGroup').style.display = 'block';
        document.getElementById('passwordRequired').style.display = 'inline';
        document.getElementById('fullName').value = '';
        document.getElementById('email').value = '';
        document.getElementById('role').value = '';
        document.getElementById('department').value = '';
        document.getElementById('language').value = 'fa';
        setModalAvatar('');
        modal.classList.add('show');
    };
    
    // ⭐⭐⭐ تابع ویرایش کاربر
    window.editUser = function(id) {
        console.log('✏️ editUser called:', id);
        const user = window.users.find(u => String(u.id) === String(id));
        if (!user) {
            showNotification('کاربر یافت نشد!', 'error');
            return;
        }

        document.getElementById('modalTitle').textContent = 'ویرایش کاربر';
        document.getElementById('editUserId').value = user.id;
        document.getElementById('username').value = user.username;
        document.getElementById('username').disabled = true;
        document.getElementById('password').value = '';
        document.getElementById('password').required = false;
        document.getElementById('passwordGroup').style.display = 'none';
        document.getElementById('passwordRequired').style.display = 'none';
        document.getElementById('fullName').value = user.full_name || '';
        document.getElementById('email').value = user.email || '';
        document.getElementById('role').value = user.role || '';
        document.getElementById('department').value = user.department || '';
        document.getElementById('language').value = user.language || 'fa';
        setModalAvatar(user.avatar || '');
        document.getElementById('userModal').classList.add('show');
    };
    
    // ⭐⭐⭐ تابع بستن مودال
    window.closeUserModal = function() {
        console.log('❌ closeUserModal called');
        const modal = document.getElementById('userModal');
        if (modal) modal.classList.remove('show');
        const usernameEl = document.getElementById('username');
        if (usernameEl) usernameEl.disabled = false;
    };
    
    // ⭐⭐⭐ تابع ذخیره کاربر
    window.saveUser = async function(event) {
        event.preventDefault();
        console.log('💾 saveUser called');
        
        const id = parseInt(document.getElementById('editUserId').value);
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const role = document.getElementById('role').value;
        const department = document.getElementById('department').value;
        const language = document.getElementById('language').value;

        if (!username || !fullName || !role) {
            showNotification('لطفاً فیلدهای الزامی را تکمیل کنید.', 'error');
            return;
        }

        if (id === 0 && !password) {
            showNotification('رمز عبور الزامی است.', 'error');
            return;
        }

        try {
            const url = window.NCR_API + '/get_users.php';
            let method = 'POST';
            let data = {
                username,
                full_name: fullName,
                email,
                role,
                department,
                language,
                avatar: document.getElementById('modalAvatarPath').value || ''
            };

            if (id > 0) {
                method = 'PUT';
                data.id = id;
            } else {
                data.password = password;
            }

            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();

            if (result.success) {
                // اگر کاربر جاری ویرایش شد، اطلاعات هدر هم به‌روزرسانی شود
                try {
                    const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
                    if (currentUser && (String(currentUser.id) === String(id) || currentUser.username === username)) {
                        currentUser.avatar = data.avatar;
                        currentUser.full_name = fullName;
                        localStorage.setItem('currentUser', JSON.stringify(currentUser));
                        if (window.updateHeaderAvatar) window.updateHeaderAvatar(currentUser);
                        const headerName = document.getElementById('userName');
                        if (headerName) headerName.textContent = fullName;
                    }
                } catch (e) { /* ignore */ }

                window.closeUserModal();
                showNotification(result.message || 'عملیات با موفقیت انجام شد.', 'success');
                await loadUsers();
                return;
            } else {
                showNotification(result.error || 'خطا در انجام عملیات.', 'error');
                return;
            }
        } catch (error) {
            console.error('❌ Save user error:', error);
            showNotification('خطا در ارتباط با سرور!', 'error');
        }
    };
    
    // ⭐⭐⭐ تابع حذف کاربر
    window.deleteUser = async function(id, username) {
        if (!confirm(`آیا از حذف کاربر "${username}" مطمئن هستید؟`)) return;

        try {
            const response = await fetch(window.NCR_API + '/get_users.php', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id })
            });
            const result = await response.json();

            if (result.success) {
                showNotification('کاربر با موفقیت حذف شد.', 'success');
                await loadUsers();
                return;
            } else {
                showNotification(result.error || 'خطا در حذف کاربر', 'error');
                return;
            }
        } catch (error) {
            console.error('❌ Delete user error:', error);
            showNotification('خطا در ارتباط با سرور!', 'error');
        }
    };
    
    // ⭐⭐⭐ تابع نمایش اعلان
    function showNotification(message, type) {
        const colors = {
            success: '#27ae60',
            error: '#e74c3c',
            warning: '#f39c12',
            info: '#3498db'
        };
        
        document.querySelectorAll('.custom-notification').forEach(el => el.remove());
        
        const notification = document.createElement('div');
        notification.className = 'custom-notification';
        notification.style.cssText = `
            position: fixed;
            top: 80px;
            right: 20px;
            padding: 15px 25px;
            background: ${colors[type] || '#3498db'};
            color: white;
            border-radius: 10px;
            font-weight: bold;
            z-index: 99999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 400px;
        `;
        notification.textContent = message;
        document.body.appendChild(notification);

        setTimeout(() => {
            notification.style.opacity = '0';
            notification.style.transition = 'opacity 0.5s';
            setTimeout(() => {
                if (notification.parentNode) notification.remove();
            }, 500);
        }, 3000);
    }
    window.showNotification = showNotification;
    
    // ============================================
    // ⭐ پر کردن dropdown نقش‌ها
    // ============================================
    function populateRoleSelect() {
        const select = document.getElementById('role');
        if (!select) return;
        
        select.innerHTML = '<option value="">انتخاب کنید</option>' + 
            window.availableRoles.map(role => 
                `<option value="${role.name}">${role.description || role.name}</option>`
            ).join('');
    }
    
    // ============================================
    // ⭐ رندر جدول کاربران
    // ============================================
    function renderUsers() {
        const tbody = document.getElementById('userTableBody');
        if (!tbody) return;
        
        if (window.users.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;">هیچ کاربری ثبت نشده است</td></tr>';
            return;
        }

        const roleLabels = {};
        window.availableRoles.forEach(r => {
            roleLabels[r.name] = r.description || r.name;
        });

        tbody.innerHTML = window.users.map((user, index) => `
            <tr>
                <td>${index + 1}</td>
                <td class="avatar-cell">${user.avatar
                    ? `<img class="user-avatar" src="${avatarUrl(user.avatar)}" alt="${user.full_name || ''}">`
                    : `<span class="user-avatar avatar-placeholder"><i class="fas fa-user"></i></span>`}</td>
                <td><strong>${user.username}</strong></td>
                <td>${user.full_name || '-'}</td>
                <td>${user.email || '-'}</td>
                <td><span class="role-badge ${user.role}">${roleLabels[user.role] || user.role}</span></td>
                <td>${user.department || '-'}</td>
                <td>${user.created_at ? new Date(user.created_at).toLocaleDateString('fa-IR') : '-'}</td>
                <td>
                    <button type="button" class="btn btn-sm btn-primary" onclick="window.location.href='add-user.html?id=${user.id}'" title="ویرایش">
                        <i class="fas fa-edit"></i>
                    </button>
                    ${user.username !== 'admin' ? `
                        <button type="button" class="btn btn-sm btn-danger" onclick="window.deleteUser(${user.id}, '${user.username}')" title="حذف">
                            <i class="fas fa-trash"></i>
                        </button>
                    ` : ''}
                </td>
            </tr>
        `).join('');
    }
    
    // ============================================
    // ⭐ بارگذاری کاربران از API
    // ============================================
    async function loadUsers() {
        const tbody = document.getElementById('userTableBody');
        if (!tbody) return;
        
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;">در حال بارگذاری...</td></tr>';
        
        try {
            const url = window.NCR_API + '/get_users.php';
            console.log('📡 Fetching users from:', url);
            
            const response = await fetch(url);
            const text = await response.text();
            console.log('📡 Users raw response:', text);
            
            let result;
            try {
                result = JSON.parse(text);
            } catch (e) {
                console.error('❌ JSON parse error:', e);
                tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:red;">خطا: پاسخ سرور نامعتبر است</td></tr>';
                return;
            }
            
            if (result.success) {
                window.users = result.data || [];
                console.log('✅ Loaded users:', window.users.length);
                
                // ⭐ نقش‌های پویا
                if (result.roles && result.roles.length > 0) {
                    window.availableRoles = result.roles;
                } else {
                    window.availableRoles = [
                        { name: 'admin', description: 'مدیر سیستم' },
                        { name: 'quality', description: 'کارشناس کنترل کیفیت' },
                        { name: 'production', description: 'کارشناس تولید' },
                        { name: 'purchasing', description: 'کارشناس خرید' },
                        { name: 'warehouse', description: 'کارشناس انبار' },
                        { name: 'engineering', description: 'کارشناس مهندسی' },
                        { name: 'ceo', description: 'مدیرعامل' },
                        { name: 'user', description: 'کاربر عادی' }
                    ];
                }
                populateRoleSelect();
                renderUsers();
            } else {
                console.error('❌ Error loading users:', result.error);
                tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:red;">خطا: ' + (result.error || '') + '</td></tr>';
            }
        } catch (error) {
            console.error('❌ Fetch error:', error);
            tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:red;">خطا در ارتباط با سرور: ' + error.message + '</td></tr>';
        }
    }
    window.loadUsers = loadUsers;
    
    // ============================================
    // ⭐ راه‌اندازی اولیه
    // ============================================
    async function initUsersPage() {
        console.log('🚀 initUsersPage started');
        
        // ⭐ منتظر بمان تا کامپوننت‌ها لود شوند
        if (typeof window.loadAllComponents === 'function') {
            try {
                await window.loadAllComponents();
                console.log('✅ Components loaded');
            } catch (e) {
                console.warn('⚠️ loadAllComponents error:', e);
            }
        }
        
        // ⭐ حالا که هدر و سایدبار لود شده‌اند، اطلاعات را پر کن
        const now = new Date();
        safeSetText('currentDate', now.toLocaleDateString('fa-IR'));
        
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (currentUser) {
            safeSetText('userName', currentUser.full_name);
        }
        
        // ⭐ حالا کاربران را لود کن
        await loadUsers();
        
        // ⭐ اعلان‌ها
        if (typeof window.updateNotifications === 'function') {
            window.updateNotifications();
        }
    }
    
    // ⭐ تصویر کاربر در مودال
    function setModalAvatar(path) {
        const preview = document.getElementById('modalAvatarPreview');
        const hidden = document.getElementById('modalAvatarPath');
        const removeBtn = document.getElementById('modalRemoveAvatarBtn');
        if (!preview || !hidden) return;

        hidden.value = path || '';

        if (path) {
            preview.innerHTML = '<img src="' + avatarUrl(path) + '" alt="avatar">';
            if (removeBtn) removeBtn.style.display = 'inline-flex';
        } else {
            preview.innerHTML = '<i class="fas fa-user"></i>';
            if (removeBtn) removeBtn.style.display = 'none';
        }
    }
    window.setModalAvatar = setModalAvatar;

    window.removeModalAvatar = function () {
        setModalAvatar('');
        const input = document.getElementById('modalAvatarFile');
        if (input) input.value = '';
    };

    async function uploadModalAvatar() {
        const input = document.getElementById('modalAvatarFile');
        if (!input || !input.files || !input.files[0]) return;

        const file = input.files[0];
        if (!/^image\//.test(file.type)) {
            showNotification('فقط فایل تصویری مجاز است.', 'error');
            return;
        }
        if (file.size > 2 * 1024 * 1024) {
            showNotification('حجم تصویر نباید بیشتر از ۲ مگابایت باشد.', 'error');
            return;
        }

        const formData = new FormData();
        formData.append('avatar', file);

        try {
            const response = await fetch(window.NCR_API + '/upload_avatar.php', { method: 'POST', body: formData });
            const result = await response.json();
            if (result.success) {
                setModalAvatar(result.path);
                showNotification('تصویر کاربر بارگذاری شد.', 'success');
            } else {
                showNotification(result.error || 'خطا در بارگذاری تصویر.', 'error');
            }
        } catch (e) {
            console.error('❌ Avatar upload failed:', e);
            showNotification('خطا در ارتباط با سرور.', 'error');
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        const input = document.getElementById('modalAvatarFile');
        if (input) input.addEventListener('change', uploadModalAvatar);
    });

    // ⭐ اجرا بعد از بارگذاری DOM
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initUsersPage);
    } else {
        initUsersPage();
    }
    
    // ⭐ بستن مودال با کلیک خارج
    document.addEventListener('DOMContentLoaded', function() {
        const modal = document.getElementById('userModal');
        if (modal) {
            modal.addEventListener('click', function(e) {
                if (e.target === this) window.closeUserModal();
            });
        }
    });
    
    console.log('✅ users.html loaded successfully');
    </script>
</body>
</html>
